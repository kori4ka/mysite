<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Великие открытия человечества</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,'Times New Roman',serif;background:#1a0e06;color:#fff;min-height:100vh;overflow-x:hidden}
.lib{min-height:100vh;background:linear-gradient(180deg,#1a0e06,#2a1608 5%,#3a1e0a 25%,#3e2210 50%,#2a1608 85%,#1a0e06 100%)}

header{text-align:center;padding:60px 24px 20px;position:relative;z-index:1}
h1{font-size:clamp(2rem,5vw,3rem);color:#f0d080;margin-bottom:12px;line-height:1.15;cursor:pointer}
.sub{font-size:1.1rem;color:#c4944a;font-style:italic;max-width:520px;margin:0 auto 28px;line-height:1.6}

.shelves{max-width:1100px;margin:0 auto;padding:0 24px 40px;position:relative;z-index:1}
.shelf{margin-bottom:30px}
.slabel{display:flex;align-items:center;gap:10px;padding:28px 20px 12px}
.slabel .yr{font-size:.75rem;font-weight:700;color:#d4a847;letter-spacing:1.5px}
.slabel .ln{flex:1;height:1px;background:rgba(212,168,71,.25)}
.slabel .nm{font-size:1.2rem;font-weight:700;color:#f0d080}

.brow{display:flex;align-items:flex-end;padding:0 20px;min-height:240px;gap:2px;justify-content:center}
.bk{cursor:pointer;transition:all .35s cubic-bezier(.25,.8,.25,1);text-decoration:none;color:inherit;display:block;position:relative}
.bk:hover{transform:translateY(-16px) scale(1.03);z-index:10}
.spine{border-radius:2px 4px 4px 2px;padding:14px 8px;min-height:190px;width:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:2px 4px 12px rgba(0,0,0,.6),inset -2px 0 4px rgba(0,0,0,.3),inset 2px 0 4px rgba(255,255,255,.08)}
.spine::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(255,215,0,.4),transparent)}
.spine::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(255,215,0,.3),transparent)}
.spine .gold-line{position:absolute;left:8px;right:8px;height:1px;background:rgba(255,215,0,.25)}
.spine .gold-line.top{top:18px}
.spine .gold-line.bot{bottom:18px}
.btitle{font-size:.82rem;font-weight:700;color:#fff;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:1px;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:1.3;max-height:150px;overflow:hidden}
.bauthor{font-size:.55rem;color:rgba(255,215,0,.6);writing-mode:vertical-rl;text-orientation:mixed;position:absolute;bottom:24px;letter-spacing:.5px;font-style:italic}
.bk:hover .spine{box-shadow:2px 8px 24px rgba(0,0,0,.7),inset -2px 0 4px rgba(0,0,0,.3),inset 2px 0 4px rgba(255,255,255,.12),0 0 20px rgba(255,215,0,.1)}

.c1{background:linear-gradient(180deg,#9B2020 0%,#7B1515 30%,#5B0A0A 100%);border-left:3px solid rgba(255,180,180,.15)}
.c2{background:linear-gradient(180deg,#1E4070 0%,#163058 30%,#0E2040 100%);border-left:3px solid rgba(150,180,255,.15)}
.c3{background:linear-gradient(180deg,#1F5038 0%,#164028 30%,#0D2818 100%);border-left:3px solid rgba(150,255,180,.15)}
.c4{background:linear-gradient(180deg,#7B4430 0%,#5C3020 30%,#3E1E12 100%);border-left:3px solid rgba(255,200,150,.15)}
.c5{background:linear-gradient(180deg,#551E4E 0%,#401638 30%,#2A0E24 100%);border-left:3px solid rgba(220,150,255,.15)}
.c6{background:linear-gradient(180deg,#9B7518 0%,#7B5A10 30%,#5B400A 100%);border-left:3px solid rgba(255,230,150,.15)}
.c7{background:linear-gradient(180deg,#185E6E 0%,#104858 30%,#0A3440 100%);border-left:3px solid rgba(150,230,255,.15)}
.c8{background:linear-gradient(180deg,#556830 0%,#3E5020 30%,#283810 100%);border-left:3px solid rgba(200,230,150,.15)}
.c9{background:linear-gradient(180deg,#822F3A 0%,#601E28 30%,#421418 100%);border-left:3px solid rgba(255,180,190,.15)}
.c10{background:linear-gradient(180deg,#3E5060 0%,#2C3C4C 30%,#1A2A3A 100%);border-left:3px solid rgba(180,200,220,.15)}

.board{height:20px;background:linear-gradient(180deg,#b87030 0%,#8c4518 30%,#6c3410 70%,#5c2e0e 100%);border-radius:0 0 4px 4px;box-shadow:0 6px 18px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.1)}
.board::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:rgba(255,255,255,.1)}

.stats{max-width:1100px;margin:0 auto;padding:20px 24px 60px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;position:relative;z-index:1}
.stat{text-align:center;padding:24px;background:rgba(255,255,255,.02);border:1px solid rgba(212,168,71,.08);border-radius:14px}
.stat .n{font-size:2rem;font-weight:900;color:#f0d080;margin-bottom:6px}
.stat .l{font-size:.82rem;color:#c4944a}

/* Discovery page */
.discovery-page{max-width:900px;margin:0 auto;padding:40px 24px 80px}
.dp-back{color:#c4944a;font-size:.95rem;cursor:pointer;margin-bottom:32px;background:none;border:none;font-family:inherit;display:inline-block}
.dp-back:hover{color:#f0d080}
.dp-era{color:#d4a847;font-size:.8rem;margin-bottom:12px;letter-spacing:1px}
.dp-title{font-size:2.5rem;color:#f0d080;margin-bottom:8px;line-height:1.15}
.dp-scientist{font-size:1.3rem;color:#c4944a;font-style:italic;margin-bottom:8px}
.dp-year{font-size:1rem;color:rgba(255,255,255,.5);margin-bottom:24px}
.dp-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.dp-tag{padding:4px 12px;border-radius:100px;font-size:.75rem;color:#c4944a;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}

.dp-quote{border-left:3px solid #d4a847;padding:16px 20px;background:rgba(212,168,71,.04);border-radius:0 10px 10px 0;margin:28px 0}
.dp-quote p{font-size:1.15rem;font-style:italic;color:#f0d080;line-height:1.6;margin-bottom:6px}
.dp-quote cite{font-size:.8rem;color:#c4944a}

.dp-section{margin-bottom:36px}
.dp-section h2{color:#f0d080;margin-bottom:14px;font-size:1.3rem}
.dp-section p{color:rgba(255,255,255,.78);line-height:1.85;margin-bottom:12px;font-size:1rem}

.dp-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0 32px}
.meta-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px}
.meta-card .ml{font-size:.7rem;color:#d4a847;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.meta-card .mv{font-size:1rem;font-weight:700;color:#fff}

.dp-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.fact-card{background:rgba(255,255,255,.03);border:1px solid rgba(212,168,71,.1);border-radius:10px;padding:18px}
.fact-card h4{color:#d4a847;margin-bottom:8px;font-size:.85rem}
.fact-card p{color:rgba(255,255,255,.75);font-size:.92rem;line-height:1.65}

.dp-timeline{position:relative;padding-left:28px;margin-top:14px}
.dp-timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:rgba(212,168,71,.2)}
.tl-item{position:relative;margin-bottom:18px;padding-left:18px}
.tl-item::before{content:'';position:absolute;left:-26px;top:5px;width:10px;height:10px;border-radius:50%;background:#d4a847;border:2px solid #1a0e06}
.tl-item .tl-year{font-size:.9rem;font-weight:700;color:#d4a847;margin-bottom:2px}
.tl-item .tl-text{font-size:.88rem;color:rgba(255,255,255,.7);line-height:1.5}

.dp-related{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.related-card{background:rgba(255,255,255,.03);border:1px solid rgba(212,168,71,.1);border-radius:10px;padding:14px;cursor:pointer;transition:all .3s;text-decoration:none;color:inherit;display:block}
.related-card:hover{background:rgba(212,168,71,.08);border-color:rgba(212,168,71,.3);transform:translateY(-2px)}
.related-card .rc-title{font-size:1rem;font-weight:700;color:#f0d080;margin-bottom:4px}
.related-card .rc-sci{font-size:.8rem;color:#c4944a;font-style:italic}
.related-card .rc-year{font-size:.75rem;color:rgba(255,255,255,.4);margin-top:4px}

footer{text-align:center;padding:40px 24px;color:rgba(255,255,255,.25);font-size:.82rem}

#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.lib{position:relative;z-index:1}

@media(max-width:768px){
.stats{grid-template-columns:1fr 1fr}
.dp-title{font-size:1.8rem}
.dp-facts{grid-template-columns:1fr}
.dp-meta{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="lib">
<canvas id="particles"></canvas>
<div id="app"></div>
</div>

<script>
const D=[
{e:"Античность",y:"~300 до н.э.",t:"Теорема Пифагора",s:"Пифагор Самосский",c:2,
fullDesc:"Фундаментальная теорема геометрии: a\u00B2 + b\u00B2 = c\u00B2. Соотношение между сторонами прямоугольного треугольника стало основой для тысяч последующих открытий. Хотя вавилоняне знали это соотношение за 1000 лет до Пифагора, именно он (или его ученики) первым дал строгое математическое доказательство.",
context:"До Пифагора математика была практической \u2014 египтяне использовали эмпирические соотношения для строительства пирамид. Пифагор первым поднял математику до уровня дедуктивной науки, где истины не наблюдаются, а доказываются. Его школа открыла существование иррациональных чисел (\u221A2), что потрясло самих пифагорейцев.",
impact:"Без теоремы Пифагора невозможны тригонометрия, навигация, архитектура, GPS-навигация и компьютерная графика. Каждый раз, когда вы пользуетесь картой на телефоне или смотрите 3D-анимацию, работает эта 2500-летняя теорема.",
facts:["Пифагор не оставил письменных трудов \u2014 все идеи передавались устно","Существует более 400 различных доказательств теоремы, включая доказательство президента США Гарфилда","Вавилоняне знали о соотношении 3-4-5 за 1000 лет до Пифагора","Пифагорейцы считали числа сакральными и верили: \u00ABвсё есть число\u00BB","Пифагор запрещал есть бобы и, по легенде, погиб из-за этого"],
timeline:[{year:"~570 до н.э.",text:"Рождение Пифагора на острове Самос"},{year:"~530 до н.э.",text:"Основание школы в Кротоне"},{year:"~500 до н.э.",text:"Открытие и доказательство теоремы"},{year:"~300 до н.э.",text:"Включение в \u00ABНачала\u00BB Евклида"}],
f:"Математика",im:"Геометрия, навигация, физика",o:"Древняя Греция",
q:"Числа правят миром.",qc:"Пифагор",
tg:["геометрия","математика"],rel:[1,3,4],
prev:"Вавилоняне на глиняных табличках (Plimpton 322, ~1800 до н.э.) знали соотношение 3-4-5, египтяне использовали верёвки с узлами для прямых углов. Но всё это были эмпирические наблюдения — ни у кого не было строгого доказательства.",
modern:"GPS-навигация (расстояние между точками), компьютерная графика и 3D-моделирование (евклидово расстояние), строительство (проверка прямых углов), физика (разложение векторов сил), архитектура, машинное обучение (метрики расстояний между данными)."},

{e:"Античность",y:"~250 до н.э.",t:"Закон рычага и гидростатика",s:"Архимед",c:1,
fullDesc:"Архимед Сиракузский \u2014 величайший математик и инженер античности. Он сформулировал закон рычага и принцип выталкивающей силы (закон Архимеда), разработал методы вычисления площадей и объёмов, предвосхитившие интегральное исчисление на 2000 лет. Также создал уникальные военные машины.",
context:"Архимед жил в период эллинистической Греции. Его предшественник Евклид систематизировал геометрию, а Архимед пошёл дальше \u2014 научился вычислять площади криволинейных фигур. Его вычисление числа \u03C0 было рекордно точным для того времени.",
impact:"Принципы Архимеда используются в судостроении, гидравлике и инженерии. Его метод исчерпывания предвосхитил интегральное исчисление Ньютона и Лейбница.",
facts:["Знаменитое \u00ABЭврика!\u00BB произнесено в ванной","Он вычислил \u03C0 с точностью до двух знаков \u2014 рекорд на 1500 лет","Создал \u00ABкогти Архимеда\u00BB для защиты Сиракуз от римлян","По легенде, мог сдвинуть корабль одной рукой через систему блоков","Римский солдат убил Архимеда, когда тот чертил фигуру на песке"],
timeline:[{year:"~287 до н.э.",text:"Рождение в Сиракузах"},{year:"~250 до н.э.",text:"Открытие закона рычага и гидростатики"},{year:"~240 до н.э.",text:"Вычисление \u03C0 и объёма шара"},{year:"212 до н.э.",text:"Гибель при осаде Сиракуз"}],
f:"Физика",im:"Механика, гидравлика",o:"Сиракузы",
q:"Дайте мне точку опоры, и я переверну Землю.",qc:"Архимед",
tg:["механика","физика","инженерия"],rel:[0,12,16],
prev:"Египтяне использовали рычаги для подъёма тяжестей, но не понимали математического закона. Архит из Тарента (IV в. до н.э.) исследовал механику, но не дал формулировки закона.",
modern:"Судостроение (расчёт плавучести кораблей и подводных лодок), гидравлика (домкраты, прессы), авиация (дирижабли), проектирование буровых установок, метеорология (воздушные массы)."},

{e:"Античность",y:"~350 до н.э.",t:"Основы формальной логики",s:"Аристотель",c:8,
fullDesc:"Аристотель создал первую формальную систему логики \u2014 силлогистику. Его учение о категориях, суждениях и умозаключениях стало фундаментом рационального мышления. \u00ABОрганон\u00BB \u2014 собрание логических трудов \u2014 оставался главным учебником логики вплоть до XIX века.",
context:"Аристотель был учеником Платона, но пошёл своим путём. Если Платон верил в мир идей, то Аристотель опирался на наблюдение. Он заложил основы биологии, политологии, риторики, этики. Его классификация животных использовалась до Линнея.",
impact:"Формальная логика \u2014 основа математики, философии, права, ИИ и программирования. Булева алгебра, из которой выросли компьютеры, \u2014 прямое развитие идей Аристотеля.",
facts:["Аристотель учил Александра Македонского","Основал школу Ликей, где преподавал гуляя \u2014 отсюда \u00ABперипатетики\u00BB","Описал более 500 видов животных","Его логика доминировала 2300 лет","Слово \u00ABкатегория\u00BB ввёл именно Аристотель"],
timeline:[{year:"384 до н.э.",text:"Рождение в Стагирах"},{year:"367 до н.э.",text:"Поступление в Академию Платона"},{year:"343 до н.э.",text:"Учитель Александра Македонского"},{year:"335 до н.э.",text:"Основание Ликея"}],
f:"Философия",im:"Логика, наука, ИИ",o:"Древняя Греция",
q:"Мы то, что мы делаем постоянно.",qc:"Аристотель",
tg:["логика","философия"],rel:[0,9,30],
prev:"Сократ развивал диалектику через вопросы, Платон — теорию идей. Но систематического метода рассуждения не существовало. Софисты использовали риторику для манипуляции, а не для поиска истины.",
modern:"Формальная логика — основа программирования (условные операторы, булева алгебра), SQL-запросов, искусственного интеллекта (логический вывод), юриспруденции (построение правовых аргументов), философии и лингвистики."},

{e:"Средневековье",y:"~820",t:"Алгебра",s:"Мухаммад аль-Хорезми",c:3,
fullDesc:"Трактат \u00ABАль-Китаб аль-мухтасар фи хисаб аль-джабр ва-ль-мукабала\u00BB стал первой книгой, посвящённой решению уравнений как самостоятельной науке. Слово \u00ABаль-джабр\u00BB дало название \u00ABалгебре\u00BB, а латинизация имени \u00ABаль-Хорезми\u00BB породила слово \u00A0\u00ABалгоритм\u00BB.",
context:"Аль-Хорезми работал в \u00ABДоме мудрости\u00BB в Багдаде \u2014 главном научном центре исламского халифата. Там переводились труды греков, индийцев и персов. Индийская позиционная система счисления, которую он популяризировал, стала основой всей современной математики.",
impact:"Без алгебры невозможна ни одна область современной науки. Алгоритмы, лежащие в основе каждого компьютера, прямо названы в честь аль-Хорезми.",
facts:["Слово \u00ABалгоритм\u00BB \u2014 латинизация его имени","Слово \u00ABалгебра\u00BB \u2014 от \u00ABal-jabr\u00BB","Работал в \u00ABДоме мудрости\u00BB \u2014 аналоге научного института","Индийские цифры попали в Европу через его труды","Его астрономические таблицы использовались 400 лет"],
timeline:[{year:"~780",text:"Рождение в Хорезме"},{year:"~820",text:"Создание трактата по алгебре"},{year:"~830",text:"Составление астрономических таблиц"},{year:"XII век",text:"Перевод на латынь"}],
f:"Математика",im:"Алгебра, программирование",o:"Багдад",
q:"Аль-Джабр \u2014 восстановление целого из частей.",qc:"Из трактата",
tg:["алгебра","алгоритмы","математика"],rel:[6,19],

{e:"Средневековье",y:"~1021",t:"Научный метод и оптика",s:"Ибн аль-Хайсам",c:6,
fullDesc:"\u00ABКнига оптики\u00BB впервые доказала, что зрение возникает от лучей, входящих в глаз, а не исходящих из него. Альхазен первым применил систематический эксперимент для проверки гипотез \u2014 за 600 лет до Галилея. Его подход \u2014 гипотеза, эксперимент, проверка \u2014 стал прообразом научного метода.",
context:"Альхазен притворился сумасшедшим, чтобы избежать гнева халифа, и в заточении написал главный труд. Его работы повлияли на Роджера Бэкона, Леонардо да Винчи, Кеплера и Декарта.",
impact:"Альхазен заложил основы экспериментальной физики и оптики. Камера-обскура, описанная им, стала предшественницей фотографии.",
facts:["Его называют \u00ABпервым настоящим учёным\u00BB","Притворился безумцем на 10 лет, чтобы избежать казни","Описал камеру-обскуру \u2014 предшественницу фотоаппарата","\u00ABКнига оптики\u00BB \u2014 7 томов","Изучал радугу и строение глаза"],
timeline:[{year:"965",text:"Рождение в Басре"},{year:"~1011",text:"Начало работы над \u00ABКнигой оптики\u00BB"},{year:"~1021",text:"Завершение \u00ABКниги оптики\u00BB"},{year:"~1040",text:"Смерть в Каире"}],
f:"Физика",im:"Оптика, научный метод",o:"Каир",
tg:["оптика","научный метод","эксперимент"],rel:[11,14],
prev:"Евклид и Птолемей считали, что глаз испускает лучи. Гален изучал анатомию глаза, но не понял механизм зрения. Арабские учёные до аль-Хайсама не проводили систематических экспериментов с контролем переменных.",
modern:"Его оптика — основа фотографии, микроскопии, телескопов, офтальмологии. Научный метод (гипотеза → эксперимент → проверка) — основа всей современной науки: физики, химии, биологии, медицины. Без этого метода нет технологий."},

{e:"Возрождение",y:"1440",t:"Печатный станок",s:"Иоганн Гутенберг",c:10,
fullDesc:"Гутенберг создал первый печатный станок с подвижными металлическими литерами. За 50 лет было напечатано больше книг, чем переписано за предыдущее тысячелетие. Это привело к Реформации, Научной революции и Просвещению.",
context:"До Гутенберга книги переписывались вручную \u2014 одна Библия стоила как дом. Гутенберг был ювелиром \u2014 его мастерство в работе с металлом позволило создать точные формы для литер. Первая напечатанная книга \u2014 Библия (1455).",
impact:"Печатный станок \u2014 величайший катализатор прогресса. Без него невозможны Реформация, Научная революция, демократия и современное образование.",
facts:["Гутенберг обанкротился и умер в бедности","Первой книгой стала Библия (1455) \u2014 сохранилось 49 экземпляров","Через 50 лет \u2014 1000+ типографий, 20 млн томов","Мартин Лютер использовал станок для тезисов \u2014 первый \u00ABвирусный контент\u00BB","До станка 5% грамотных, через 100 лет \u2014 47%"],
timeline:[{year:"~1400",text:"Рождение в Майнце"},{year:"1440",text:"Создание печатного станка"},{year:"1455",text:"Печать 42-строчной Библии"},{year:"1468",text:"Смерть в бедности"}],
f:"Технология",im:"Революция в знании",o:"Майнц, Германия",
q:"Машина для победы над невежеством.",qc:"Лейбниц о Гутенберге",
tg:["печать","революция","знание"],rel:[9,7,13],
prev:"Китайцы изобрели бумагу (II век) и ксилографию (VII век). Корейцы создали металлические подвижные литеры (XIII век). Но ни одна из этих культур не создала полной системы: шрифт + пресс + краска + бумага.",
modern:"Печать привела к массовой грамотности, Научной революции, Реформации, демократии. Без неё нет газет, журналов, образования, современного общества. Следующий скачок в распространении информации — интернет (1989)."},

{e:"Возрождение",y:"1543",t:"Гелиоцентрическая модель",s:"Николай Коперник",c:2,
fullDesc:"Коперник предложил модель, в которой Земля вращается вокруг Солнца. Его труд \u00ABО вращениях небесных сфер\u00BB стал началом Научной революции, разрушив 1400-летнюю геоцентрическую парадигму.",
context:"Коперник был каноником католической церкви \u2014 ирония, учитывая что теория противоречила догме. Он боялся публиковать из-за обвинений в ереси. По легенде, книгу вручили умирающему Копернику в день его смерти.",
impact:"Гелиоцентризм запустил цепь: Галилей доказал наблюдениями, Кеплер открыл эллиптические орбиты, Ньютон объяснил гравитацией.",
facts:["Коперник также был врачом, экономистом и переводчиком","\u00ABО вращениях\u00BB опубликовано в год его смерти","Церковь запретила книгу только через 73 года","Галилей осуждён в 1633 именно за защиту идей Коперника","Планеты Коперника ещё двигались по круговым орбитам"],
timeline:[{year:"1473",text:"Рождение в Торне"},{year:"1510\u20131530",text:"Разработка модели"},{year:"1543",text:"Публикация"},{year:"1616",text:"Включение в индекс запрещённых"}],
f:"Астрономия",im:"Научная революция",o:"Фромборк, Польша",
tg:["астрономия","гелиоцентризм"],rel:[3,11,12],
prev:"Аристарх Самосский (III век до н.э.) предлагал гелиоцентризм, но его отвергли. Птолемей создал сложную геоцентрическую систему с эпициклами, работавшую 1400 лет. Омара Хайяма (XI век) критиковал Птолемея, но не предложил альтернативу.",
modern:"Гелиоцентризм — основа современной астрономии и космонавтики. Понимание, что Земля не центр Вселенной, изменило философию, теологию и самоосознание человечества. Сегодня мы знаем о миллиардах галактик — всё началось с идеи Коперника."},

{e:"Возрождение",y:"1543",t:"Анатомия человека",s:"Андреас Везалий",c:4,
fullDesc:"До Везалия анатомия базировалась на трудах Галена (II век), который вскрывал животных. Везалий первым начал систематически dissectировать людей и обнаружил сотни ошибок. Его \u00ABDe humani corporis fabrica\u00BB с иллюстрациями ученика Тициана стала поворотным моментом.",
context:"Везалию было 28 лет, когда он опубликовал главный труд. Он тайно вскрывал тела \u2014 это было нелегально и опасно. Разоблачение ошибок Галена вызвало ярость консерваторов.",
impact:"Современная медицина, хирургия и физиология невозможны без точного понимания анатомии. Везалий превратил медицину из набора суеверий в науку.",
facts:["Везалию было 28 при публикации главного труда","Тайно вскрывал тела, включая висельников","Более 300 детальных иллюстраций","Обнаружил, что у людей нет кости в сердце, как утверждал Гален","Погиб при кораблекрушении в 37 лет"],
timeline:[{year:"1514",text:"Рождение в Брюсселе"},{year:"1537",text:"Начало исследований в Падуе"},{year:"1543",text:"Публикация \u00ABFabrica\u00BB"},{year:"1564",text:"Гибель при кораблекрушении"}],
f:"Медицина",im:"Анатомия, хирургия",o:"Брюссель/Падуя",
tg:["анатомия","медицина"],rel:[14,15,23],
prev:"Гален (II век) был авторитетом 1300 лет, но вскрывал животных (свиней, обезьян), не людей. Мондино де Луцци (XIV век) проводил вскрытия, но не публиковал систематических наблюдений. Анатомия была набором ошибок Галена.",
modern:"Современная медицина, хирургия, физиология невозможны без точной анатомии. Рентген, МРТ, КТ — всё основано на знании анатомии. Каждое медицинское образование начинается с анатомии по Везалию."},

{e:"Возрождение",y:"1590",t:"Микроскоп",s:"Янсен / Левенгук",c:7,
fullDesc:"Захарий Янсен изобрёл первый составной микроскоп (~1590), но прорыв совершил Левенгук (1670-е). Создавая линзы (увеличение до 275\u00D7), он впервые увидел бактерий, сперматозоиды, эритроциты. Мир, невидимый глазу, оказался населён жизнью.",
context:"Левенгук был торговцем тканями, которому нужна была лупа. Не имел научного образования, но мастерство в создании линз привело к открытиям, потрясшим науку. Письма в Лондонское общество поначалу встречали скептически.",
impact:"Микроскоп \u2014 основа биологии, медицины и микробиологии. Без него невозможны понимание инфекций, антибиотики, клеточная биология и генетика.",
facts:["Левенгук создал 500+ микроскопов, сохранилось 11","Линзы давали 275\u00D7 \u2014 рекорд на 150 лет","Первым увидел бактерии, эритроциты, сперматозоиды","Не писал на латыни \u2014 его письма на голландском","Королевское общество отправило комиссию для проверки"],
timeline:[{year:"~1590",text:"Янсен создаёт первый микроскоп"},{year:"1665",text:"Гук публикует \u00ABМикрографию\u00BB"},{year:"1674",text:"Левенгук открывает \u00ABанималькулов\u00BB"},{year:"1683",text:"Левенгук обнаруживает бактерии"}],
f:"Технология",im:"Микробиология, медицина",o:"Нидерланды",
tg:["микроскоп","биология"],rel:[10,23,25],
prev:"Лупы использовались с античности. Роджер Бэкон описывал увеличительные стёкла (XIII век). Но никто не создал составной микроскоп с несколькими линзами до Янсена, и никто не увидел микромир до Левенгука.",
modern:"Микроскоп — основа биологии, медицины, микробиологии. Без него нет понимания инфекций, антибиотиков, клеточной биологии, генетики, вирусологии, диагностики рака. Современные электронные микроскопы видят отдельные атомы."},

{e:"Возрождение",y:"1600",t:"Научный метод",s:"Бэкон / Галилей",c:9,
fullDesc:"Бэкон сформулировал индуктивный метод, Галилей добавил эксперимент и математику. Наука отделилась от философии и религии. Галилей подтвердил гелиоцентризм телескопом, открыв спутники Юпитера и кратеры Луны.",
context:"До научного метода истина устанавливалась авторитетом. Бэкон в \u00ABНовом Органоне\u00BB (1620) заявил: природа познаётся через наблюдение. Галилей продемонстрировал силу метода: наблюдения фаз Венеры и лунного рельефа опровергли Аристотеля.",
impact:"Научный метод \u2014 основа всего современного знания. Медицина, физика, биология \u2014 всё основано на принципе \u00ABгипотеза \u2192 эксперимент \u2192 проверка\u00BB.",
facts:["Галилей обнаружил 4 спутника Юпитера в 1610","Наблюдал кратеры Луны, доказав что небесные тела не \u00ABидеальны\u00BB","Бэкон был канцлером Англии, осуждён за коррупцию","Галилея судили в 1633, заставили отречься","По легенде: \u00ABИ тем не менее она вертится!\u00BB"],
timeline:[{year:"1564",text:"Рождение Галилея"},{year:"1610",text:"Спутники Юпитера"},{year:"1620",text:"Бэкон публикует \u00ABНовый Органон\u00BB"},{year:"1633",text:"Суд над Галилеем"}],
f:"Методология",im:"Вся современная наука",o:"Англия/Италия",
tg:["метод","эмпиризм","наука"],rel:[12,9,7],
prev:"Средневековая наука основывалась на авторитете Аристотеля и Библии. Истина устанавливалась цитированием, не наблюдением. Аль-Хайсам применял эксперимент, но не формализовал метод как универсальный принцип.",
modern:"Научный метод — основа всего современного знания. Медицина, физика, биология, инженерия, экономика — всё основано на «гипотеза → эксперимент → проверка». Без него нет технологий, космических полётов, интернета, вакцинации."},

{e:"Просвещение",y:"1687",t:"Законы механики и гравитация",s:"Исаак Ньютон",c:2,
fullDesc:"\u00ABМатематические начала натуральной философии\u00BB \u2014 три закона движения и закон тяготения. Ньютон объединил земную и небесную механику. Также создал математический анализ и корпускулярную теорию света.",
context:"Ньютон работал в Кембридже во время Великой чумы. В \u00ABгод чудес\u00BB (1665\u20131666) он в одиночку заложил основы трёх великих наук. Позже стал директором Монетного двора и раскрыл масштаб фальшивомонетчества.",
impact:"\u00ABНачала\u00BB \u2014 возможно, самая важная научная книга. Инженерия, авиация, космонавтика \u2014 всё основано на трёх законах Ньютона.",
facts:["Создал анализ одновременно с Лейбницем","\u00ABГод чудес\u00BB \u2014 сидел дома во время чумы","Тайно занимался алхимией, написал больше об алхимии, чем о физике","Был директором Монетного двора","Эйнштейн показал: законы Ньютона \u2014 приближение"],
timeline:[{year:"1642",text:"Рождение в Вулсторпе"},{year:"1665\u201366",text:"\u00ABГод чудес\u00BB"},{year:"1687",text:"Публикация \u00ABНачал\u00BB"},{year:"1727",text:"Смерть, Вестминстерское аббатство"}],
f:"Физика",im:"Вся классическая механика",o:"Англия",
q:"Если я видел дальше других, то потому что стоял на плечах гигантов.",qc:"Исаак Ньютон",
tg:["механика","гравитация","физика"],rel:[1,16,12],
prev:"Галилей изучал движение тел (инерция, падение), Кеплер — орбиты планет (3 закона), но никто не объединил земную и небесную механику. Декарт развил аналитическую геометрию, Хук изучал упругость, но общей теории не было.",
modern:"Без законов Ньютона нет инженерии, авиации, космонавтики, архитектуры. Все мосты, здания, ракеты рассчитаны по Ньютону. Его математический анализ (исчисление) — основа физики, инженерии, экономики, машинного обучения."},

{e:"Просвещение",y:"1752",t:"Электричество",s:"Бенджамин Франклин",c:6,
fullDesc:"Франклин доказал электрическую природу молнии и ввёл понятия \u00ABположительный\u00BB и \u00ABотрицательный\u00BB заряд. Его работа заложила основу электрофизики и электротехники.",
context:"Франклин был не только учёным, но и журналистом, дипломатом, отцом-основателем США. Его электрические эксперименты начались как хобби \u2014 переписка с английскими коллегами стала бестселлером в Европе.",

facts:["Опыт с воздушным змеем был смертельно опасен","Изобрёл громоотвод, спасший тысячи зданий","Единственный, кто подписал все три основополагающих документа США","Предложил концепцию летнего времени за 200 лет до реализации","Портрет на $100, хотя никогда не был президентом"],
timeline:[{year:"1706",text:"Рождение в Бостоне"},{year:"1747",text:"Начало экспериментов"},{year:"1752",text:"Опыт с воздушным змеем"},{year:"1776",text:"Декларация независимости"}],
f:"Физика",im:"Электротехника",o:"Филадельфия, США",

{e:"Просвещение",y:"1774",t:"Кислород и новая химия",s:"Пристли / Лавуазье",c:7,
fullDesc:"Пристли открыл кислород (1774), но не понял природу. Лавуазье доказал, что кислород \u2014 основа горения и дыхания, разрушив теорию флогистона. Создал первую систему химической номенклатуры, доказал закон сохранения массы.",
context:"Лавуазье был аристократом и сборщиком податей \u2014 это стоило ему жизни (гильотина, 1794). Его жена Мари-Анн была talented художницей и делала иллюстрации. Вместе они создали лабораторию, где химия стала точной наукой.",
impact:"Современная химия, биология, фармакология основаны на понимании кислорода. Без Лавуазье не было бы Пастера, Менделеева и химической промышленности.",
facts:["Лавуазье казнён на гильотине","Жена рисовала иллюстрации \u2014 они были соавторами","Пристли назвал кислород \u00ABдефлогистированным воздухом\u00BB","Лавуазье доказал что алмаз \u2014 углерод, сгорев его","Закон сохранения массы \u2014 основа всей химии"],
timeline:[{year:"1743",text:"Рождение Лавуазье"},{year:"1774",text:"Пристли открывает кислород"},{year:"1789",text:"\u00ABЭлементарный курс химии\u00BB"},{year:"1794",text:"Казнь Лавуазье"}],
f:"Химия",im:"Современная химия",o:"Англия/Франция",

{e:"XIX век",y:"1859",t:"Теория эволюции",s:"Чарльз Дарвин",c:3,

facts:["20 лет откладывал публикацию","Жена Эмма была набожной \u2014 они спорили","Болел всю жизнь \u2014 возможно, тропическая болезнь","\u00ABВыживает сильнейший\u00BB \u2014 не Дарвина","Только 1 из 1000 видов дожил до наших дней"],
timeline:[{year:"1809",text:"Рождение"},{year:"1831\u201336",text:"Путешествие на \u00ABБигле\u00BB"},{year:"1859",text:"\u00ABПроисхождение видов\u00BB"},{year:"1882",text:"Смерть, Вестминстерское аббатство"}],
f:"Биология",im:"Вся биология",o:"Даун, Англия",
q:"Выживают не самые сильные, а те, кто лучше приспосабливается.",qc:"Чарльз Дарвин",
tg:["эволюция","биология"],rel:[18,23,26],
prev:"Ламарк (1809) предложил эволюцию через наследование приобретённых признаков — механизм неверен. Чамберс анонимно издал «Следы творения» (1844) — идея эволюции, но без механизма. Эразм Дарвин (дед Чарльза) писал об эволюции, но без доказательств.",

{e:"XIX век",y:"1865",t:"Законы наследственности",s:"Грегор Мендель",c:8,

impact:"Без ОТО нет GPS (спутники корректируют время), ядерной энергетики (E=mc\u00B2), лазеров и современной космологии.",

{e:"XX век",y:"1928",t:"Пенициллин",s:"Александр Флеминг",c:3,

tg:["антибиотики","медицина"],rel:[15,23,22],

q:"Маленький шаг для человека, гигантский скачок для человечества.",qc:"Армстронг",

prev:"Циолковский (1903) разработал теорию реактивного движения. Годдард (1926) запустил первую жидкостную ракету. Королёв создал «Союз». Гагарин (1961) полетел в космос. Но для Луны нужны были ракеты в 100 раз мощнее.",

{e:"XX век",y:"1947",t:"Транзистор",s:"Бардин, Браттейн, Шокли",c:10,
fullDesc:"Транзистор \u2014 полупроводниковое устройство, управляющее электрическим током. Заменил громоздкие вакуумные лампы. Стал основой всей электроники \u2014 от радиоприёмников до смартфонов и суперкомпьютеров.",
context:"Работа велась в Bell Labs. Первые транзисторы были большими и ненадёжными, но за 50 лет размер уменьшился до нанометров. Закон Мура: количество транзисторов на чипе удваивается каждые 2 года. Сегодня в смартфоне ~10 миллиардов транзисторов.",
impact:"Без транзистора нет компьютеров, телефонов, интернета, космических аппаратов, медицинской электроники. Вся цифровая цивилизация построена на транзисторах.",
facts:["Первый транзистор был размером с ладонь","Сегодня в одном чипе ~10 млрд транзисторов","Размер транзистора \u2014 несколько нанометров (меньше вируса)","Закон Мура работал 50+ лет","Создатели получили Нобелевскую премию (1956)"],
timeline:[{year:"1947",text:"Первый транзистор в Bell Labs"},{year:"1958",text:"Первая интегральная схема"},{year:"1971",text:"Первый микропроцессор Intel 4004"},{year:"2020-е",text:"Транзисторы размером 3 нм"}],
f:"Физика/Технология",im:"Вся электроника",o:"Bell Labs, США",
tg:["электроника","полупроводники","компьютеры"],rel:[29,31,32],
prev:"Вакуумные лампы были громоздкими, хрупкими, потребляли много энергии. Твердотельная физика изучала полупроводники. Лилиенфельд запатентовал полевой транзистор (1925), но не смог реализовать. Bell Labs поставила задачу систематически.",
modern:"Без транзистора нет компьютеров, смартфонов, интернета, телевизоров, космических аппаратов, медицинской электроники. Вся цифровая цивилизация построена на транзисторах. Сегодня в одном чипе ~10 млрд транзисторов размером 3 нм."},

{e:"XX век",y:"1989",t:"World Wide Web",s:"Тим Бернерс-Ли",c:2,
fullDesc:"Бернерс-Ли в CERN создал систему гипертекстовых документов, связанных ссылками. Первый сайт (info.cern.ch) заработал 6 августа 1991. Он дал миру HTML, HTTP и URL. Отказался патентовать \u2014 WWW стала бесплатной.",
context:"Работал в CERN, где тысячи учёных обменивались данными. Нужна была простая система для хранения и обмена. Предложение \u00ABVague, but exciting\u00BB (\u00ABНеясно, но увлекательно\u00BB) едва не отклонили. Мог стать миллиардером \u2014 выбрал открытость.",
impact:"WWW изменила коммуникацию, торговлю, образование, развлечения. Без неё нет социальных сетей, электронной коммерции, онлайн-образования.",
facts:["Первый сайт: info.cern.ch \u2014 до сих пор работает","Мог стать триллионером \u2014 отдал идею бесплатно","Предложение назвали \u00ABVague, but exciting\u00BB","В 2012 зажёг Олимпийский огонь","5 млрд+ пользователей интернета сегодня"],
timeline:[{year:"1989",text:"Предложение в CERN"},{year:"1990",text:"Первый сервер и браузер"},{year:"1991, 6 августа",text:"Первый сайт"},{year:"1993",text:"CERN объявляет WWW бесплатной"}],
f:"Технология",im:"Вся коммуникация",o:"CERN, Женева",
tg:["интернет","Web","коммуникация"],rel:[22,30,33],
prev:"Интернет (ARPANET) существовал с 1969. Были email, FTP, Usenet — но всё требовало технических знаний. Ванневар Буш предложил «Memex» (1945), Нельсон — «гипертекст» (1965). Но простой системы обмена документами для учёных не было.",
modern:"WWW изменила всё: коммуникацию, торговлю ($5.8 трлн электронной коммерции), образование, развлечения, политику, науку. 5+ млрд пользователей. Без WWW нет Google, Amazon, Wikipedia, YouTube, социальных сетей."},

{e:"XXI век",y:"2003",t:"Геном человека",s:"Международный консорциум",c:3,
fullDesc:"Проект (1990\u20132003) \u2014 расшифровка всей ДНК: 3 млрд пар нуклеотидов, ~20 500 генов. Открыл эру персонализированной медицины, генной терапии, понимания человеческой эволюции.",
context:"Стоил $3 млрд, занял 13 лет. Сегодня секвенирование \u2014 $500 за день. Конкуренция с Celera ускорила работу. Обнаружили: 99.9% ДНК идентичны у всех людей.",
impact:"Персонализированная медицина, генетические тесты, CRISPR, судебная экспертиза, понимание эволюции \u2014 всё после расшифровки генома.",
facts:["$3 млрд тогда, $500 сегодня","У человека ~20 500 генов \u2014 меньше, чем у риса (40 000)","99.9% ДНК идентичны у всех","Только 1.5% кодирует белки \u2014 остальное \u00ABтёмная материя\u00BB","Делим 60% генов с шимпанзе, 50% \u2014 с бананом"],
timeline:[{year:"1990",text:"Начало проекта"},{year:"2000",text:"Предварительная расшифровка"},{year:"2003",text:"Полная расшифровка"},{year:"2022",text:"Закрыты все пробелы"}],
f:"Биология",im:"Персонализированная медицина",o:"Международный проект",
tg:["геном","ДНК","медицина"],rel:[23,26,27],
prev:"Сенгер секвенировал первый геном (бактерия φX174, 1977, 5386 пар). Методы улучшались, но геном человека (3 млрд пар) казался недостижимым. Многие учёные (включая Нобелевского лауреата Гилберта) сомневались в осуществимости и целесообразности.",

{e:"XXI век",y:"2012",t:"CRISPR-Cas9",s:"Дудна, Шарпантье",c:1,
fullDesc:"CRISPR-Cas9 \u2014 точное редактирование генов. \u00ABВырезает\u00BB и \u00ABвставляет\u00BB участки ДНК с хирургической точностью. Основан на бактериальной иммунной системе. Шарпантье и Дудна \u2014 Нобелевская (2020).",
context:"CRISPR открыли случайно \u2014 изучая, как бактерии защищаются от вирусов. Шарпантье и Дудна поняли: систему можно перепрограммировать. Сегодня дешевле, точнее и проще любых предыдущих методов. Этический вопрос: редактирование эмбрионов.",
impact:"Лечение серповидноклеточной анемии, некоторых видов слепоты и рака. Засухоустойчивые культуры. В будущем \u2014 тысячи наследственных заболеваний.",
facts:["Основан на иммунной системе бактерий","Нобелевская через 8 лет после открытия","В Китае родились дети с отредактированным геномом (2018) \u2014 скандал","$50 на эксперимент \u2014 раньше тысячи","Создают комаров, не переносящих малярию"],
timeline:[{year:"2012",text:"Публикация метода"},{year:"2018",text:"Первые отредактированные дети"},{year:"2020",text:"Нобелевская премия"},{year:"2023",text:"Первое одобренное лекарство"}],
f:"Биотехнология",im:"Генная инженерия",o:"США/Франция",
tg:["CRISPR","генетика","редактирование"],rel:[23,26,27],
prev:"Рестрикционные ферменты (1970) позволяли «резать» ДНК. ПЦР (1983) — копировать. ZFN и TALEN (2000-е) — редактировать, но дорого и сложно. CRISPR (2012) — простой, дешёвый, точный метод, основанный на бактериальной иммунной системе.",
modern:"Лечение серповидноклеточной анемии (одобрено FDA, 2023), некоторых видов слепоты, рака. Засухоустойчивые культуры. Комары без малярии. Диагностика болезней. Этические дебаты: редактирование эмбрионов человека."},

{e:"XXI век",y:"2015",t:"Гравитационные волны",s:"LIGO",c:5,
fullDesc:"14 сентября 2015 LIGO зафиксировал гравитационные волны от столкновения двух чёрных дыр в 1,3 млрд световых лет. Подтвердил предсказание Эйнштейна (1916). Открыл эру гравитационно-волновой астрономии. Нобелевская \u2014 2017.",
context:"LIGO \u2014 два детектора с плечами 4 км. Измеряют изменения в 1/10000 диаметра протона. Сигнал искали месяцами. Объявили 11 февраля 2016.",
impact:"Новый способ наблюдать Вселенную. До этого астрономия была \u00ABзрительной\u00BB \u2014 теперь \u00ABслуховой\u00BB. \u00ABСлышим\u00BB столкновения чёрных дыр, невидимые телескопам.",
facts:["Измеряют 1/10000 диаметра протона","Столкновение выделило энергию 3 солнечных масс","Сигнал шёл 1,3 млрд лет \u2014 на Земле была докембрийская эра","Нобелевская через год \u2014 рекордно быстро","К 2024 \u2014 100+ событий"],
timeline:[{year:"1916",text:"Эйнштейн предсказывает"},{year:"1992",text:"Строительство LIGO"},{year:"2015, 14 сентября",text:"Первая регистрация"},{year:"2017",text:"Нобелевская премия"}],
f:"Физика",im:"Астрофизика",o:"США",
tg:["гравитация","чёрные дыры","физика"],rel:[20,29],
prev:"Эйнштейн предсказал волны (1916), но сомневался в обнаружении. Вебер строил детекторы (1960-70-е), но результаты не были убедительными. Халс и Тейлор (1974) косвенно подтвердили — пульсар терял энергию, как предсказывала ОТО. Нобелевская 1993.",
modern:"Новый способ наблюдать Вселенную — гравитационно-волновая астрономия. «Слышим» столкновения чёрных дыр и нейтронных звёзд, невидимые телескопам. Помогает изучать свойства гравитации, ядерную физику нейтронных звёзд, скорость расширения Вселенной."},

{e:"XXI век",y:"2019",t:"Первое фото чёрной дыры",s:"Event Horizon Telescope",c:4,

impact:"Триумф международной коллаборации. Подтвердил ОТО в экстремальных условиях. Открыл новую эру наблюдательной астрофизики.",
facts:["Чёрная дыра \u2014 6,5 млрд солнечных масс","Тень \u2014 ~40 млрд км","Данные \u2014 5 петабайт, перевозили самолётами","Алгоритм \u2014 29-летняя Кэти Бауман","В 2022 \u2014 фото Стрельца A* (центр Млечного Пути)"],

prev:"Шварцшильд решил уравнения Эйнштейна для чёрных дыр (1916). Хокинг (1974) — излучение. Но прямых изображений не было. Считались теоретической абстракцией. Получить изображение тени на расстоянии 55 млн световых лет казалось невозможным.",
