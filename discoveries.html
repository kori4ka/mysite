{e:"XXI век",y:"2022",t:"Термоядерный синтез с выхлопом",s:"NIF, Ливерморская лаборатория",c:6,
fullDesc:"5 декабря 2022 NIF впервые получил больше энергии от синтеза, чем затратил. 192 лазера сфокусировали энергию на капсуле с дейтерием и тритием \u2014 произошёл синтез, как в Солнце. Шаг к неисчерпаемой чистой энергии.",
context:"60 лет пытались достичь \u00ABзажигания\u00BB. NIF использует инерциальный синтез. Выход незначительный (3,15 МДж при 2,05 МДж), но принцип доказан. ITER строится во Франции для масштаба.",
impact:"Термоядерный синтез \u2014 потенциально бесконечная чистая энергия. Топливо (дейтерий) \u2014 в океанской воде. Нет выбросов CO2, нет радиоактивных отходов, нет риска расплавления.",
facts:["3,15 МДж при 2,05 МДж \u2014 первый \u00ABплюс\u00BB","Топливо \u2014 в океанской воде, запас на миллионы лет","Реакция при 100 млн \u00B0C \u2014 в 7 раз горячее Солнца","ITER строится во Франции с 2007","Коммерческий реактор \u2014 не раньше 2040-х"],
timeline:[{year:"1958",text:"Начало исследований"},{year:"2022, 5 декабря",text:"Первый \u00ABплюс\u00BB"},{year:"2023",text:"Повторение с большим выходом"},{year:"2035+",text:"Запуск ITER"}],
f:"Физика",im:"Энергетика будущего",o:"Ливермор, США",
tg:["термояд","энергия","физика"],rel:[20,12],
prev:"Сахаров и Таллер разработали токамак (1950-е). 60 лет пытались достичь «зажигания». ITER строится с 2007, но ещё не запущен. Многие частные компании (Commonwealth Fusion, TAE) работают над компактными реакторами. Термояд «всегда через 30 лет».",
modern:"Термоядерный синтез — потенциально бесконечная чистая энергия. Топливо (дейтерий) — в океанской воде, запас на миллионы лет. Нет выбросов CO₂, нет долгоживущих радиоактивных отходов, нет риска расплавления. Коммерческий реактор — не раньше 2040-х."},
{e:"Античность",y:"~400 до н.э.",t:"Теория атомизма",s:"Демокрит",c:8,
fullDesc:"Демокрит и его учитель Левкипп первыми предложили, что вся материя состоит из неделимых частиц — атомов. Атомы различаются формой, размером и расположением, но не имеют внутреннего устройства. Эта идея была гениальной интуицией, не подтверждённой экспериментами.",
context:"Древнегреческие философы спорили: материя делима бесконечно (Аристотель) или состоит из пределов делимости (Демокрит)? Демокрит утверждал: если делить материю до конца, останутся неделимые «атомы» (от греч. «неделимый»). Его теория объясняла изменения, движение и разнообразие мира.",
impact:"Атомизм стал основой всей современной физики и химии. Дальтон возродил идею (1803), Резерфорд открыл строение атома (1911), квантовая механика описала его поведение. Без атомизма нет ядерной энергетики, полупроводников, нанотехнологий.",
facts:["Демокрит написал 70+ трудов, но ни один не сохранился","Атомисты считали, что атомы движутся в пустоте (вакууме)","Теория отрицала телеологию — мир не имеет цели, только закономерности","Демокрит считал, что душа тоже состоит из атомов","Атомизм был забыт на 2000 лет и возрождён в XVII веке"],
timeline:[{year:"~440 до н.э.",text:"Левкипп и Демокрит формулируют теорию"},{year:"~350 до н.э.",text:"Аристотель критикует атомизм"},{year:"50 до н.э.",text:"Лукреций пишет «О природе вещей»"},{year:"1803",text:"Дальтон возрождает атомную теорию"}],
f:"Философия/Физика",im:"Атомная физика, химия",o:"Древняя Греция",
q:"По истине нет ничего, кроме атомов и пустоты.",qc:"Демокрит",
tg:["атомизм","философия","физика"],rel:[0,2,17],
prev:"Фалес считал первоосновой воду, Анаксимен — воздух, Гераклит — огонь. Эмпедокл предложил четыре элемента. Но никто не дошёл до идеи неделимых частиц.",
modern:"Ядерная физика, полупроводники, нанотехнологии, квантовые компьютеры — всё это развитие идеи атомизма. Современная наука подтвердила: всё состоит из атомов."},

{e:"Античность",y:"~400 до н.э.",t:"Медицина Гиппократа",s:"Гиппократ",c:3,
fullDesc:"Гиппократ отделил медицину от религии и магии. Он утверждал, что болезни имеют естественные причины, а не божественное наказание. Его «Клятва Гиппократа» стала этическим стандартом для врачей на 2400 лет. Корпус гиппократовых текстов содержит 70 трактатов.",
context:"До Гиппократа лечение было жреческим — храмы Асклепия, заговоры, ритуалы. Гиппократ ввёл наблюдение, описание симптомов, прогноз. Он создал систему: четыре «юмора» (кровь, слизь, жёлтая и чёрная желчь), дисбаланс которых вызывает болезнь.",
impact:"Гиппократ заложил основы клинической медицины: анамнез, осмотр, диагноз, прогноз. Его этический кодекс (не навреди) действует до сих пор. Хотя теория четырёх юмеров ошибочна, подход — наблюдение и систематизация — стал научным методом в медицине.",
facts:["«Клятва Гиппократа» запрещала аборты и эвтаназию","Гиппократ описал пальцы Гиппократа — метод вправления вывиха","Он первым описал рак как «carcinos» (краб)","Его школа на острове Кос обучала 200+ лет","Теория четырёх юмеров доминировала до XIX века"],
timeline:[{year:"~460 до н.э.",text:"Рождение Гиппократа на острове Кос"},{year:"~400 до н.э.",text:"Создание медицинского корпуса"},{year:"~350 до н.э.",text:"Аристотель развивает сравнительную анатомию"},{year:"160 до н.э.",text:"Гален систематизирует учение Гиппократа"}],
f:"Медицина",im:"Клиническая медицина, этика",o:"Древняя Греция",
q:"Жизнь коротка, искусство длительно, случай быстр, опыт обманчив, суждение трудно.",qc:"Гиппократ",
tg:["медицина","этика"],rel:[7,13,20],
prev:"Египетские папирусы (Эберса, 1550 до н.э.) описывали лекарства, но не методологию. Вавилонская медицина была магической. Гиппократ первым применил систематическое наблюдение.",
modern:"Клинический метод (анамнез, осмотр, диагноз) — основа современной медицины. «Клятва Гиппократа» эволюционировала, но принцип «не навреди» остаётся. Этика врачебной практики обсуждается до сих пор."},

{e:"Античность",y:"~240 до н.э.",t:"Окружность Земли",s:"Эратосфен",c:6,
fullDesc:"Эратосфен из Кирены вычислил окружность Земли с точностью до 2-15%. Он заметил, что в Сиене (Асуан) в день летнего солнцестояния Солнце находится в зените (тени нет), а в Александрии — отклоняется на 7.2°. Зная расстояние между городами (~800 км), он вычислил окружность: ~39 375 км (реально 40 075 км).",
context:"Эратосфен был директором Александрийской библиотеки — крупнейшего научного центра античности. Он также изобрёл армиллярную сферу, составил каталог 675 звёзд, ввёл термины «география» и «широта/долгота». Его метод был прост, но требовал понимания сферичности Земли.",
impact:"Это доказало, что Земля круглая и её размер можно измерить. Открытие повлияло на Колумба (он ошибся, думая, что Земля меньше). Современная геодезия началась с Эратосфена. Без этого знания нет навигации, картографии, спутников.",
facts:["Ошибка Эратосфена — всего 2-15% из-за неточного измерения расстояния","Он вычислил наклон земной оси (50 лет до Гиппарха)","Эратосфен предложил високосный год","Он составил карту мира от Британии до Индии","Библиотека Александрии сгорела, но его идеи сохранились"],
timeline:[{year:"~276 до н.э.",text:"Рождение Эратосфена в Кирене"},{year:"~245 до н.э.",text:"Директор Александрийской библиотеки"},{year:"~240 до н.э.",text:"Измерение окружности Земли"},{year:"~194 до н.э.",text:"Смерть в Александрии"}],
f:"География/Астрономия",im:"Навигация, картография",o:"Древняя Греция (Египет)",
q:"Всё невозможно познать, но можно измерить.",qc:"Эратосфен (приписывается)",
tg:["география","астрономия","измерения"],rel:[0,6,22],
prev:"Пифагорейцы предполагали сферичность Земли (VI век до н.э.). Аристотель доказал это по тени Луны (IV век до н.э.). Аристарх оценил расстояние до Луны. Но никто не измерял размер Земли.",
modern:"Современная геодезия использует спутники GPS для измерения Земли с точностью до миллиметра. Метод Эратосфена — основа триангуляции. Сегодня окружность Земли = 40 075 км."},

{e:"Античность",y:"~100 до н.э.",t:"Механизм Антикитеры",s:"Неизвестный мастер",c:10,
fullDesc:"Механизм Антикитеры — древнегреческий аналоговый компьютер для предсказания астрономических положений и затмений. Содержит 30+ бронзовых шестерёнок, моделирующих движение Солнца, Луны, планет. Найден в затонувшем корабле у острова Антикитера (1901).",
context:"Механизм датируется ~150-100 до н.э. Его создание требует знаний трибометрии (зубчатые передачи), астрономии, механики. Ничего подобного не создавалось ещё 1500 лет до механических часов XIV века. Это доказывает, что греки могли создавать сложные механические устройства.",
impact:"Механизм изменил понимание древних технологий. Он показал, что античная наука была не только теоретической, но и практической. Современные реплики подтвердили его точность. Это первый известный аналоговый компьютер.",
facts:["Найден водолазами-искателями губок в 1901 году","Содержит надписи — инструкцию на древнегреческом","Предсказывает затмения с точностью до часа","Показывает даты Олимпийских игр","Подобные устройства описаны Цицероном, но не сохранились"],
timeline:[{year:"~150 до н.э.",text:"Создание механизма (предположительно)"},{year:"~75 до н.э.",text:"Корабль затонул у Антикитеры"},{year:"1901",text:"Обнаружен водолазами"},{year:"2006",text:"3D-сканирование раскрыло все 30 шестерёнок"}],
f:"Механика/Астрономия",im:"Вычислительная техника",o:"Древняя Греция",
q:"Технологии древних превосходили наши ожидания.",qc:"Современный историк науки",
tg:["механика","астрономия","компьютеры"],rel:[0,6,18],
prev:"Греки создавали простые автоматы (Герон Александрийский, I век н.э.), но ничего подобного сложности Антикитеры. Это уникальное устройство, не имевшее продолжения.",
modern:"Механизм Антикитеры — прадедушка компьютера. Современные аналоговые компьютеры использовались до 1950-х. Реплики механизма выставлены в музеях. 3D-печать позволила создать работающие копии."},

{e:"Античность",y:"~130 до н.э.",t:"Астрономия и каталог звёзд",s:"Гиппарх Никейский",c:7,
fullDesc:"Гиппарх создал первый звёздный каталог (850 звёзд), открыл прецессию земной оси (медленное смещение полюса за 26 000 лет), разработал тригонометрию для астрономических расчётов. Его система координат (широта/долгота) используется до сих пор.",
context:"Гиппарх работал на Родосе и в Александрии. Он использовал армиллярную сферу (изобретение Эратосфена) для точных измерений. Его каталог звёзд — основа для Птолемея («Альмагест», 150 н.э.), который доминировал 1400 лет.",
impact:"Гиппарх заложил основы наблюдательной астрономии. Его открытие прецессии объяснило, почему полюс мира смещается (Полярная звезда не всегда была Полярной). Тригонометрия стала математическим языком астрономии, навигации, инженерии.",
facts:["Открыл прецессию, сравнивая свои наблюдения с более ранними","Создал шкалу звёздной величины (1-6, где 1 — самые яркие)","Определил расстояние до Луны с ошибкой 5%","Разработал методы предсказания затмений","Его каталог утрачен, но сохранён Птолемеем"],
timeline:[{year:"~190 до н.э.",text:"Рождение в Никее (Изник, Турция)"},{year:"~160 до н.э.",text:"Начало астрономических наблюдений"},{year:"~130 до н.э.",text:"Открытие прецессии, каталог звёзд"},{year:"~120 до н.э.",text:"Смерть на Родосе"}],
f:"Астрономия/Математика",im:"Навигация, тригонометрия",o:"Древняя Греция",
q:"Звёзды не лгут — лгут лишь интерпретации.",qc:"Гиппарх (приписывается)",
tg:["астрономия","тригонометрия","наблюдения"],rel:[0,6,22],
prev:"Вавилоняне вели записи затмений и движений планет 1000+ лет, но не создали математической модели. Греки до Гиппарха (Аристарх, Евдокс) строили геометрические модели, но без точных измерений.",
modern:"Современная астрометрия (точные измерения положений звёзд) использует спутники (Hipparcos, Gaia). Каталог Gaia содержит 1.8 млрд звёзд. Прецессия учитывается в GPS и астрономических таблицах."},

{e:"Средневековье",y:"~850",t:"Порох и огнестрельное оружие",s:"Китайские алхимики",c:1,
fullDesc:"Китайские алхимики, искавшие эликсир бессмертия, случайно открыли смесь селитры, серы и угля — чёрный порох (IX век). К X веку появились «огненные копья», ракеты, бомбы. К XIII веку — бронзовое огнестрельное оружие. Путь к современному оружию был открыт.",
context:"Порох — побочный продукт даосской алхимии. Первые рецепты (850) описаны в трактате «Чжэнь юань мяо дао яо лüe». Монголы распространили порох по Евразии (XIII век). Арабы усовершенствовали формулу, европейцы создали пушки (XIV век).",
impact:"Порох революционизировал войну. Рыцарские замки стали бесполезны против пушек. Феодализм рухнул — дворянство потеряло военное преимущество. Колонизация стала возможной благодаря огнестрельному оружию. Современное оружие — развитие пороха.",
facts:["Первое упоминание — 850 год, трактат о даосской алхимии","Монголы использовали пороховые ракеты против европейцев (1241)","Китайская «огненная копьё» — прообраз ружья (X век)","Порох вызвал переход от холодного оружия к огнестрельному","Без пороха нет современной военной инженерии, шахт, фейерверков"],
timeline:[{year:"~850",text:"Первые рецепты пороха в Китае"},{year:"969",text:"Китайское военное руководство описывает ракеты"},{year:"1241",text:"Монголы применяют порох в Европе"},{year:"1326",text:"Первые европейские пушки"}],
f:"Химия/Военное дело",im:"Революция в войне",o:"Китай",
q:"Алхимики искали бессмертие — нашли смерть.",qc:"Историк науки",
tg:["химия","вооружение","технологии"],rel:[5,14,18],
prev:"Греки и римляне использовали «греческий огонь» (горючая жидкость), но не порох. Индийцы и арабы знали о селитре, но не создали взрывчатую смесь.",
modern:"Порох заменён бездымным (XIX век), но принципы те же. Современная военная промышленность, пиротехника, горное дело (взрывные работы), фейерверки — всё это развитие идеи пороха."},

{e:"Средневековье",y:"~1040",t:"Магнитный компас",s:"Китайские изобретатели",c:2,
fullDesc:"Китайцы открыли, что намагниченная стрелка указывает на юг (I век до н.э. — «си нан», «южный указатель»). К XI веку создали навигационный компас для мореплавания. Это позволило плавать в открытом море, не теряя берег из виду. Компас изменил карту мира.",
context:"Первый компас — ложка из магнетита на гладкой пластине (I век). К 1040 году — плавающая игла в воде. Шэнь Ко (1088) описал намагничивание иглы. Арабы переняли компас (XII век), европейцы — XIII век. Морская навигация стала возможной.",
impact:"Компас сделал возможными Великие географические открытия (XV-XVI века). Колумб, Васко да Гама, Магеллан — все использовали компас. Без него нет глобальной торговли, колонизации, современной карты мира. Компас — основа навигации до GPS.",
facts:["Первый компас указывал на юг, не север (Китай)","Шэнь Ко открыл магнитное склонение (1088)","Компас позволял плавать ночью и в тумане","Европейцы добавили картушку с делениями (XIII век)","Современный GPS — цифровой компас"],
timeline:[{year:"~200 до н.э.",text:"Китайский «южный указатель» (ложка)"},{year:"~1040",text:"Плавающая игла для навигации"},{year:"1187",text:"Компас в Европе (Александр Неккам)"},{year:"1300",text:"Портолан — морская карта с компасом"}],
f:"Навигация/Физика",im:"Мореплавание, география",o:"Китай",
q:"Тот, кто потерял компас, потерял мир.",qc:"Китайская поговорка",
tg:["навигация","магнетизм","мореплавание"],rel:[6,18,22],
prev:"Моряки ориентировались по звёздам, солнцу, береговым ориентирам. Викинги использовали «солнечные камни» (поляризованный кристалл). Но в облачную погоду навигация была невозможна.",
modern:"Современные корабли и самолёты используют гироскопические и спутниковые компасы (GPS). Но магнитный компас остаётся резервным инструментом. Каждый смартфон содержит цифровой компас (магнитометр)."},

{e:"Средневековье",y:"~700",t:"Ветряная мельница",s:"Персидские инженеры",c:4,
fullDesc:"Персы создали вертикальную ветряную мельницу (VII-X века) для помола зерна и ирригации. В отличие от римских водяных мельниц, ветряные работали в засушливых регионах. Это была первая машина, использующая энергию ветра систематически.",
context:"Римляне использовали водяные мельницы (I век н.э.), но они требовали рек. Персия (Иран) — засушливая, с сильными ветрами. Вертикальная мельница с горизонтальным валом и парусами работала в пустыне. Арабы распространили технологию (X-XI века).",
impact:"Ветряные мельницы стали основой аграрной экономики Средневековья. В Европе (XII век) их адаптировали (вертикальный вал). К XIII веку — тысячи мельниц. Это первая «возобновляемая энергия». Современные ветрогенераторы — прямые потомки.",
facts:["Персидские мельницы имели вертикальный вал (современные — горизонтальный)","К XIII веку в Англии ~10 000 мельниц","Мельницы использовались для помола, ирригации, подъёма воды","Промышленная революция вытеснила мельницы паром","Современные ветряки — развитие средневековой идеи"],
timeline:[{year:"~644",text:"Первые упоминания в Персии"},{year:"~900",text:"Распространение в исламском мире"},{year:"1180",text:"Ветряные мельницы в Европе"},{year:"1850",text:"Упадок из-за паровых машин"}],
f:"Инженерия/Энергетика",im:"Аграрная революция",o:"Персия (Иран)",
q:"Ветер невидим, но его сила мелет зерно.",qc:"Персидская поговорка",
tg:["энергетика","инженерия","сельское хозяйство"],rel:[5,14,29],
prev:"Римляне и греки использовали водяные колёса (I век до н.э. — I век н.э.). Витрувий описал их в «Десяти книгах об архитектуре». Но ветряная энергия не использовалась до персов.",
modern:"Современные ветрогенераторы ( Denmark, Vestas, Германия) — прямые потомки средневековых мельниц. Ветроэнергетика — одна из самых быстрорастущих отраслей. В 2022 ветряки обеспечивают ~7% мировой электроэнергии."},

{e:"Средневековье",y:"1088",t:"Университет как учреждение",s:"Болонский университет",c:5,
fullDesc:"Болонский университет (Италия, 1088) — старейший непрерывно действующий университет. Он ввёл систему: профессор, студенты, лекции, экзамены, степени (бакалавр, магистр, доктор). Модель распространилась по Европе (Париж, Оксфорд, Кембридж).",
context:"До университетов образование было в монастырских и соборных школах. Болонья — город торговцев, нуждающихся в юристах. Студенты объединялись в «университеты» (лат. universitas — общность), нанимали профессоров, устанавливали программу. Это была корпорация, как гильдия.",
impact:"Университеты создали систему высшего образования, которая существует 900+ лет. Бакалавр → магистр → доктор — болонская система. Без университетов нет научной революции, Просвещения, современной науки, технологии. Это институт, передающий знания поколениям.",
facts:["Болонский университет основан студентами, не профессорами","Первые факультеты: право, медицина, теология","Парижский университет (1150) — центр схоластики","Оксфорд (1167), Кембридж (1209) — английские аналоги","Система степеней не менялась 900 лет"],
timeline:[{year:"1088",text:"Основание Болонского университета"},{year:"1150",text:"Парижский университет"},{year:"1167",text:"Оксфордский университет"},{year:"1209",text:"Кембриджский университет"}],
f:"Образование",im:"Система высшего образования",o:"Италия",
q:"Университет — место, где спорят 900 лет.",qc:"Историк образования",
tg:["образование","наука","институции"],rel:[2,3,9],
prev:"Академия Платона (IV век до н.э.) и Ликей Аристотеля (IV век до н.э.) были философскими школами, не университетами. Мусульманские медресе (Аль-Азхар, 970) — религиозные школы, не светские университеты.",
modern:"Современные университеты — прямые потомки средневековых. Болонская система (бакалавр-магистр) введена в Европе (1999). Нобелевские лауреаты — выпускники университетов. Наука невозможна без университетской системы."},

{e:"Средневековье",y:"~1200",t:"Банковское дело и чеки",s:"Итальянские и арабские купцы",c:6,
fullDesc:"Средневековые итальянские банкиры (Флоренция, Венеция, Генуя) и арабские купцы создали современное банковское дело: векселя, чеки (араб. «sakk»), двойную бухгалтерию, страховку, акционерные общества. Это сделало возможной международную торговлю.",
context:"Арабское слово «sakk» (чек) — от «sakk» (документ на выплату). Итальянские банкиры (Медичи, Барди, Перуцци) XV века — первые международные банки. Они создали «билет» (bill of exchange) — предшественник чека. Двойная бухгалтерия ( debit/credit) — флорентийское изобретение.",
impact:"Банковская система — основа современной экономики. Без неё нет международной торговли, инвестиций, кредитов, фондовых бирж. Современные банки, страховые компании, акционерные общества — развитие средневековых идей. Финансовая революция (XVI-XVII века) невозможна без этого.",
facts:["Слово «банк» от итальянского «banca» (скамья менял)","Слово «банкрот» от «banca rotta» (сломанная скамья)","Медичи (Флоренция) — самая богатая семья XV века","Двойная бухгалтерия описана Пачоли (1494)","Арабские чеки использовались от Испании до Индии"],
timeline:[{year:"~1150",text:"Итальянские банкиры создают векселя"},{year:"~1200",text:"Арабские чеки в международной торговле"},{year:"1397",text:"Банк Медичи во Флоренции"},{year:"1494",text:"Пачоли публикует двойную бухгалтерию"}],
f:"Экономика/Финансы",im:"Международная торговля",o:"Италия/Арабский мир",
q:"Деньги делают деньги — если есть доверие.",qc:"Флорентийский банкир",
tg:["экономика","финансы","торговля"],rel:[3,5,24],
prev:"Римляне использовали деньги и кредиты, но не банковскую систему. Византийцы меняли деньги, но не создали чеки. Арабский халифат (VIII-X века) развил финансовую математику, но не банки.",
modern:"Современные банки, кредитные карты, электронные переводы, SWIFT — развитие средневековых идей. Двойная бухгалтерия — стандарт 700+ лет. Без этого нет капитализма, мировой экономики, глобализации."},

{e:"Средневековье",y:"1202",t:"Арабские цифры и ноль в Европе",s:"Фибоначчи (Леонардо Пизанский)",c:7,
fullDesc:"Фибоначчи ввёл арабские цифры (0-9) и позиционную систему счисления в Европе через книгу «Liber Abaci» (1202). До этого европейцы использовали римские цифры (I, V, X, L, C, D, M), неудобные для вычислений. Арабские цифры + ноль = революция в математике.",
context:"Арабские цифры пришли из Индии (VI век) через аль-Хорезми (IX век). Фибоначчи, сын итальянского купца, изучал математику в Алжире. Он показал, что арабская система проще для торговли, бухгалтерии, инженерии. «Liber Abaci» («Книга абака») — учебник практической математики.",
impact:"Без арабских цифр и нуля невозможны современная математика, наука, инженерия, компьютеры. Римские цифры неудобны для умножения, деления, дробей. Арабская система — основа арифметики. Компьютеры используют двоичную систему (0 и 1) — развитие позиционного принципа.",
facts:["Фибоначчи описал последовательность 1, 1, 2, 3, 5, 8, 13... (числа Фибоначчи)","Римские цифры: для умножения XXVII × XIV нужен абак","Арабские цифры: XXVII × XIV = 378 за секунды","Ноль (0) — индийское изобретение, переданное через арабов","Без нуля нет позиционной системы, алгебры, исчисления"],
timeline:[{year:"~600",text:"Индийская позиционная система с нулём"},{year:"~820",text:"Аль-Хорезми описывает индийскую систему"},{year:"1202",text:"Фибоначчи публикует «Liber Abaci»"},{year:"1450",text:"Арабские цифры вытесняют римские в Европе"}],
f:"Математика",im:"Арифметика, вычисления",o:"Индия → Арабский мир → Европа",
q:"Без нуля и девяти цифр мы не могли бы считать до десяти.",qc:"Фибоначчи (парафраз)",
tg:["математика","числа","вычисления"],rel:[0,3,17],
prev:"Римляне использовали римские цифры (I, V, X, L, C, D, M). Вавилоняне — шестидесятеричную систему (отсюда 60 минут, 360 градусов). Греки — алфавитную систему. Но ни одна не была позиционной с нулём.",
modern:"Арабские цифры — стандарт worldwide. Компьютеры используют двоичную (0, 1), восьмеричную (0-7), шестнадцатеричную (0-9, A-F) системы — всё это развитие позиционного принципа. Без нуля нет программирования, криптографии, науки."},

{e:"Возрождение",y:"1609",t:"Телескоп и астрономические наблюдения",s:"Галилео Галилей",c:9,
fullDesc:"Галилей не изобрёл телескоп (голландец Липперсгей, 1608), но первым направил его на небо (1609). Он открыл: горы на Луне, спутники Юпитера (4), фазы Венеры, пятна на Солнце. Эти наблюдения доказали гелиоцентризм Коперника и разрушили аристотелевскую космологию.",
context:"Первый телескоп Галилея увеличивал в 3 раза. К 1610 — в 30 раз. Он опубликовал «Звёздный вестник» (Sidereus Nuncius, 1610) — первое описание небесных тел через телескоп. Открытия потрясли учёных. Иезуиты приняли их, доминиканцы — нет. Конфликт с Церковью стал неизбежен.",
impact:"Телескоп изменил астрономию навсегда. Наблюдения доказали, что Луна не идеальна (горы), Юпитер имеет спутники (не всё вращается вокруг Земли), Венера проходит фазы (вращается вокруг Солнца). Это стало эмпирическим доказательством Коперника. Начало наблюдательной астрономии.",
facts:["Галилей назвал 4 спутника Юпитера «медийские планеты» (в честь мецената)","Он обнаружил, что Млечный Путь — миллиарды звёзд","Галилей рисовал Луну с горами и кратерами","Папа Павел V принял его в Риме, но позже запретил учить Коперника","Галилей был осуждён (1633), но его книги тайно публиковались в Голландии"],
timeline:[{year:"1608",text:"Липперсгей патентует телескоп в Голландии"},{year:"1609",text:"Галилей создаёт 20-кратный телескоп"},{year:"1610",text:"«Звёздный вестник» — публикация открытий"},{year:"1632",text:"«Диалог» о двух системах мира"}],
f:"Астрономия",im:"Наблюдательная астрономия",o:"Италия",
q:"И всё-таки она вертится!",qc:"Галилей (приписывается, 1633)",
tg:["астрономия","телескоп","наблюдения"],rel:[6,9,19],
prev:"Коперник (1543) предложил гелиоцентризм математически, но без наблюдательных доказательств. Тихо Браге (1570-е) вёл точные наблюдения невооружённым глазом, но не использовал телескоп.",
modern:"Современные телескопы (Hubble, James Webb) — прямые потомки галилеевского. Космические телескопы видят галактики на расстоянии 13 млрд световых лет. Адаптивная оптика компенсирует атмосферные искажения. Галилей начал революцию."},

{e:"Возрождение",y:"1609-1619",t:"Законы планетарного движения",s:"Иоганн Кеплер",c:4,
fullDesc:"Кеплер открыл 3 закона движения планет: 1) Орбиты — эллипсы, Солнце в фокусе; 2) Планета заметает равные площади за равное время (неравномерное движение); 3) Квадрат периода пропорционален кубу среднего расстояния. Законы описали движение планет математически.",
context:"Кеплер работал с данными Тихо Браге (самые точные до-телескопные наблюдения). Он 10 лет пытался понять орбиту Марса. Отверг круговые орбиты (Аристотель, Коперник) и доказал — эллипсы. Это был прорыв: природа не обязана быть «совершенной».",
impact:"Законы Кеплера — основа небесной механики. Ньютон вывел их из закона тяготения (1687). Без них нет расчёта орбит спутников, межпланетных станций, понимания динамики галактик. Кеплер показал: математика описывает физическую реальность.",
facts:["Кеплер был ассистентом Тихо Браге, получил данные после его смерти","Он верил в «музыку сфер» — математическую гармонию планет","Законы работают для любых орбит, не только планет","Ньютон доказал: законы Кеплера следуют из F=GmM/r²","Современные миссии (Voyager, Mars rovers) используют законы Кеплера"],
timeline:[{year:"1600",text:"Кеплер — ассистент Тихо Браге в Праге"},{year:"1609",text:"Законы 1 и 2 (эллипсы, равные площади)"},{year:"1619",text:"Закон 3 (периоды и расстояния)"},{year:"1627",text:"Рудольфинские таблицы — точные эфемериды"}],
f:"Астрономия/Математика",im:"Небесная механика",o:"Германия/Чехия",
q:"Геометрия существовала до сотворения мира.",qc:"Кеплер",
tg:["астрономия","орбиты","математика"],rel:[6,10,22],
prev:"Коперник (1543) предложил гелиоцентризм, но использовал круговые орбиты с эпициклами. Тихо Браге вёл точные наблюдения, но не нашёл закономерностей. Кеплер объединил данные и математику.",
modern:"Законы Кеплера используются для расчёта орбит спутников, МКС, межпланетных станций. GPS корректирует время по ОТО, но орбиты — по Кеплеру. Без них нет космонавтики."},

{e:"Просвещение",y:"1735",t:"Классификация живой природы",s:"Карл Линней",c:8,
fullDesc:"Линней создал иерархическую систему классификации организмов: царство → класс → отряд → род → вид. Ввёл бинарную номенклатуру (род + вид: Homo sapiens). Его «Система природы» (1735) упорядочила хаос названий. Система используется до сих пор.",
context:"До Линнея названия видов были произвольными, длинными, разными в каждой стране. Линней (Швеция) предложил унификацию. Он классифицировал ~12 000 видов растений и животных. Его система искусственна (по внешним признакам), но стала основой для естественной классификации (Дарвин).",
impact:"Линней — «отец таксономии». Без классификации невозможны биология, экология, медицина (идентификация патогенов), сельское хозяйство. Бинарная номенклатура — международный стандарт. Каждый новый вид получает латинское имя по Линнею.",
facts:["Линней назвал человека Homo sapiens («человек разумный»)","Он классифицировал растения по числу тычинок (искусственная система)","Линней был ботаником, врачом, зоологом","Его сын продолжил работу после смерти отца","Современная филогенетика (ДНК) уточнила, но не отменила систему"],
timeline:[{year:"1707",text:"Рождение Линнея в Швеции"},{year:"1735",text:"«Система природы» — 1-е издание"},{year:"1753",text:"«Виды растений» — бинарная номенклатура"},{year:"1758",text:"10-е издание «Системы» — стандарт"}],
f:"Биология/Таксономия",im:"Классификация жизни",o:"Швеция",
q:"Бог создал, Линней упорядочил.",qc:"Современник Линнея",
tg:["биология","классификация","таксономия"],rel:[15,21,25],
prev:"Аристотель классифицировал животных (IV век до н.э.). Рэй (1686) предложил определение вида. Но систематической иерархической классификации не было до Линнея.",
modern:"Современная таксономия использует ДНК для уточнения классификации. Но бинарная номенклатура Линнея — стандарт. Каждый новый вид (даже микроб) получает латинское имя. Биоразнообразие каталогизировано по Линнею."},

{e:"Просвещение",y:"1769",t:"Паровая машина Уатта",s:"Джеймс Уатт",c:10,
fullDesc:"Уатт усовершенствовал паровую машину Ньюкомена (1712), добавив отдельный конденсатор (1769). Это увеличило КПД в 4 раза. Машина Уатта стала универсальным двигателем для фабрик, шахт, транспорта. Начало Промышленной революции.",
context:"Ньюкомен (1712) создал паровую машину для откачки воды из шахт, но она потребляла много угля. Уатт (Шотландия, инженер Университета Глазго) понял: цилиндр охлаждается каждый цикл — потеря энергии. Его решение — отдельный конденсатор. Патент 1769.",
impact:"Паровая машина Уатта — двигатель Промышленной революции. Фабрики, железные дороги (Стефенсон, 1829), пароходы (Фултон, 1807) — всё на пару. Угольная промышленность, металлургия, текстиль — рост в 10 раз. Переход от аграрного общества к индустриальному.",
facts:["Уатт ввёл термин «лошадиная сила» для сравнения с лошадьми","Его партнёр Мэтью Болтон финансировал разработку","Машина Уатта работала в 4 раза эффективнее Ньюкомена","Уатт изобрёл центробежный регулятор (автоматическое управление)","Паровая машина — предшественник двигателя внутреннего сгорания"],
timeline:[{year:"1712",text:"Ньюкомен создаёт первую паровую машину"},{year:"1765",text:"Уатт придумал отдельный конденсатор"},{year:"1776",text:"Первая коммерческая машина Уатта"},{year:"1782",text:"Машина двойного действия (вперёд-назад)"}],
f:"Инженерия/Энергетика",im:"Промышленная революция",o:"Шотландия",
q:"Я продаю здесь, сэр, то, что весь мир желает иметь — силу.",qc:"Болтон (партнёр Уатта)",
tg:["пар","энергетика","промышленность"],rel:[5,14,18],
prev:"Герон Александрийский (I век) создал «эолипил» — паровую турбину (игрушка). Папен (1690) и Ньюкомен (1712) создали рабочие машины, но неэффективные. Уатт решил проблему КПД.",
modern:"Паровые турбины (не поршневые машины) обеспечивают ~80% мировой электроэнергии (уголь, атом, газ). Двигатель внутреннего сгорания (1876) заменил пар в транспорте, но пар остался в энергетике. Уатт начал эру машин."},

{e:"Просвещение",y:"1780",t:"Биоэлектричество",s:"Луиджи Гальвани",c:3,
fullDesc:"Гальвани обнаружил, что лапки лягушки сокращаются при прикосновении металлического скальпеля (1780). Он заключил: в организме есть «животное электричество». Вольта оспорил: это контакт двух металлов. Спор привёл к созданию Voltaic pile (1800) — первой батареи.",
context:"Гальвани (Италия, Болонья) экспериментировал с электричеством на лягушках. Он заметил: подвешенная на медном крючке лягушка дёргается, касаясь железной решётки. Два разных металла + влажная ткань = ток. Гальвани: это «животное электричество». Вольта: нет, это физика.",
impact:"Открытие Гальвани — основа нейрофизиологии. Нервные импульсы — электрические сигналы. Электрокардиограмма (ЭКГ), электроэнцефалограмма (ЭЭГ) регистрируют биоэлектричество. Спор с Вольтой привёл к батарее — начало электричества как технологии.",
facts:["Гальвани не знал о вольтовом столбе — его открыл Вольта","Вольта назвал батарею «органом искусственного электричества»","Наполеон пригласил Гальвани в Париж, но тот отказался","Гальвани умер в бедности (1798), Вольта получил славу","Термин «гальванизация» — от имени Гальвани"],
timeline:[{year:"1780",text:"Гальвани открывает сокращение лягушачьих лапок"},{year:"1791",text:"Публикация «Трактат о силах электричества»"},{year:"1800",text:"Вольта создаёт первый гальванический элемент"},{year:"1820",text:"Эрстед связывает электричество и магнетизм"}],
f:"Физиология/Физика",im:"Нейрофизиология, электричество",o:"Италия",
q:"Животное электричество — ключ к пониманию жизни.",qc:"Гальвани",
tg:["электричество","физиология","нервы"],rel:[11,14,20],
prev:"Мушенбрук (1745) изобрёл лейденскую банку (конденсатор). Франклин (1752) доказал электрическую природу молнии. Но никто не связал электричество с живой тканью до Гальвани.",
modern:"ЭКГ (электрокардиограмма), ЭЭГ (электроэнцефалограмма), стимуляция нервов, кардиостимуляторы — всё это биоэлектричество по Гальвани. Нейронауки изучают электрические сигналы мозга. Гальвани начал революцию."},

{e:"XIX век",y:"1829",t:"Паровоз и железные дороги",s:"Джордж Стефенсон",c:1,
fullDesc:"Стефенсон создал паровоз «Ракета» (1829), победивший на соревнованиях Liverpool and Manchester Railway. Скорость 48 км/ч — рекорд. Железные дороги изменили транспорт, экономику, общество. Началась эра массовых перевозок.",
context:"Тревитик (1804) создал первый паровоз, но рельсы ломались. Стефенсон (Англия, шахтёр) построил «Ракету» с многотрубным котлом. Скорость, надёжность, экономичность. Железные дороги распространились: Европа (1830-40-е), Россия (1837, Царское Село), США (1830-60-е).",
impact:"Железные дороги — кровеносная система индустриальной экономики. Уголь, железо, текстиль, люди — массовые перевозки. Города росли вдоль дорог. Время стало стандартизированным (железнодорожное время). Без железных дорог нет массовой урбанизации, мировой торговли.",
facts:["«Ракета» весила 4.5 тонны, тянула 13 тонн, скорость 48 км/ч","Первая общественная ж/д: Stockton-Darlington (1825), Стефенсон","Трансконтинентальная ж/д США (1869) соединила побережья","Транссиб (1891-1916) — 9288 км, longest в мире","Железные дороги сократили время Лондон-Эдинбург с 12 дней до 12 часов"],
timeline:[{year:"1804",text:"Тревитик — первый паровоз (неудачный)"},{year:"1825",text:"Стефенсон: Stockton-Darlington Railway"},{year:"1829",text:"«Ракета» — 48 км/ч, победа на соревнованиях"},{year:"1830",text:"Liverpool-Manchester Railway — первая магистраль"}],
f:"Транспорт/Инженерия",im:"Массовый транспорт",o:"Англия",
q:"Железные дороги сократили мир.",qc:"Современник Стефенсона",
tg:["транспорт","пар","железные дороги"],rel:[14,18,22],
prev:"Кони и кареты — основные средства транспорта 5000 лет. Каналы (XVIII век) — для тяжёлых грузов, но медленно. Пароходы (Фултон, 1807) — по воде. На суше нужен был паровой двигатель.",
modern:"Скоростные поезда (Шинкансэн, TGV, Сапсан) — 300+ км/ч. Железные дороги экологичнее автомобилей и самолётов. Грузовые поезда перевозят уголь, зерно, контейнеры. Стефенсон начал эру массового транспорта."},

{e:"XIX век",y:"1844",t:"Телеграф Морзе",s:"Сэмюэл Морзе",c:2,
fullDesc:"Морзе создал практический электромагнитный телеграф (1837) и азбуку Морзе (точки-тире). Первая линия: Вашингтон-Балтимор (1844). Сообщение: «Что создал Бог!» Телеграф уничтожил расстояние в коммуникации. Начало эры мгновенной связи.",
context:"До телеграфа сообщения путешествовали с курьерами, поездами, кораблями — дни, недели. Морзе (художник, США) заинтересовался электромагнетизмом после разговора об электричестве (1832). Он разработал код: каждая буква — комбинация точек и тире. Первая демонстрация (1844) потрясла мир.",
impact:"Телеграф — «викторианский интернет». Мгновенная связь изменила бизнес (биржи), политику (дипломатия), журналистику (новости), войну (управление армиями). Мировые часы синхронизировались по телеграфу. Без телеграфа нет телефона, радио, интернета.",
facts:["Первое сообщение: «What hath God wrought!» (Число создал Бог!)","Морзе предложил код из точек и тире — универсальный","К 1860-м — 200 000 км телеграфных линий в США","Трансатлантический кабель (1858) соединил Европу и Америку","SOS (··· — — — ···) — сигнал бедствия с 1906"],
timeline:[{year:"1837",text:"Морзе демонстрирует телеграф"},{year:"1844",text:"Первая линия: Вашингтон-Балтимор"},{year:"1858",text:"Первый трансатлантический кабель (неудачный)"},{year:"1866",text:"Успешный трансатлантический кабель"}],
f:"Связь/Инженерия",im:"Мгновенная коммуникация",o:"США",
q:"Расстояния больше не существует.",qc:"Морзе (парафраз)",
tg:["связь","электричество","коммуникации"],rel:[11,14,24],
prev:"Семафорный телеграф (шап, 1792) — оптический, требовал видимости. Электрический телегя (Гаусс, Вебер, 1833) — лабораторный прототип. Морзе сделал его практичным.",
modern:"Телеграф заменён телефоном, интернетом, но код Морзе используется в авиации (NDB), радиолюбителями, военной связью. Принцип мгновенной передачи информации — основа интернета."},

{e:"XIX век",y:"1861",t:"Микробы и пастеризация",s:"Луи Пастер",c:7,
fullDesc:"Пастер доказал, что болезни вызывают микробы, а не «миазмы» (плохой воздух) (1861). Он разработал пастеризацию (нагрев 60-70°C убивает микробы) для вина, пива, молока. Создал вакцины от сибирской язвы (1881) и бешенства (1885). Микробная теория — основа медицины.",
context:"До Пастера врачи не мыли руки, оперировали в грязных халатах. Сепсис убивал 50% рожениц (Земмельвейс, 1847, не был услышан). Пастер (химик, Франция) доказал: брожение и гниение вызывают микроорганизмы. Кох (Германия) выделил конкретные микробы (туберкулёз, холера).",
impact:"Микробная теория революционизировала медицину. Стерилизация, антисептика (Листер, 1867), антибиотики (Флеминг, 1928) — всё от Пастера. Пастеризация спасла миллионы от инфекций. Вакцины (Пастер, Кох) предотвратили эпидемии. Без микробной теории нет современной хирургии, терапии.",
facts:["Пастер не был врачом — он был химиком","Он доказал теорию опытом с S-образной колбой (воздух входит, микробы не проходят)","Пастер создал первую вакцину от бешенства (1885, мальчик Жозеф Мейстер)","Пастеризация применяется к молоку, соку, вину, пиву","Институт Пастера (1888) — центр микробиологии"],
timeline:[{year:"1857",text:"Пастер доказывает роль микробов в брожении"},{year:"1861",text:"Опыт с S-образной колбой — микробы в воздухе"},{year:"1881",text:"Вакцина от сибирской язвы"},{year:"1885",text:"Вакцина от бешенства"}],
f:"Медицина/Микробиология",im:"Антисептика, вакцины",o:"Франция",
q:"Микробы — враги, которых мы увидели.",qc:"Пастер",
tg:["микробы","медицина","вакцины"],rel:[13,20,26],
prev:"Левенгук (1683) увидел «анималькулов», но не связал их с болезнями. Земмельвейс (1847) предложил мыть руки, но врачи отвергли. Пастер дал теоретическое обоснование.",
modern:"Антибиотики, стерилизация, вакцины, антисептика — всё от Пастера. COVID-19 вакцины (mRNA) — развитие идеи. Пастеризация защищает продукты. Микробиом человека — новая наука."},

{e:"XX век",y:"1898-1903",t:"Радиоактивность",s:"Мария и Пьер Кюри",c:6,
fullDesc:"Беккерель (1896) открыл: урановые соли спонтанно излучают невидимые лучи. Мария Кюри назвала явление «радиоактивностью» и открыла полоний и радий (1898). Кюри доказали: радиоактивность — свойство атомов, не молекул. Это разрушило идею неделимости атома.",
context:"Мария Склодовская (Польша) приехала в Париж (1891). Она изучала «лучи Беккереля» для диссертации. В сарае, без финансирования, она переработала тонны урановой руды, выделила 0.1 г радия. Пьер Кюри (муж) присоединился. Нобелевские: Физика (1903, с Беккерелем), Химия (1911, Мария).",
impact:"Радиоактивность показала: атомы не неделимы, в них скрыта огромная энергия. Это привело к ядерной физике, атомной энергии, ядерному оружию, лучевой терапии, радиоизотопной диагностике. Радиоактивность изменила понимание материи и энергии.",
facts:["Мария Кюри — первая женщина-нобелиат, единственный человек с двумя Нобелями в разных науках","Пьер Кюри погиб в аварии (1906) — Мария продолжила одна","Радий светился в темноте — «радиевая мода» (часы, косметика)","Мария умерла от лучевой болезни (1934)","Её тетради радиоактивны до сих пор (хранятся в свинцовом контейнере)"],
timeline:[{year:"1896",text:"Беккерель открывает лучи урана"},{year:"1898",text:"Кюри открывают полоний и радий"},{year:"1903",text:"Нобелевская премия по физике"},{year:"1911",text:"Мария — Нобелевская по химии"}],
f:"Физика/Химия",im:"Ядерная эра",o:"Польша/Франция",
q:"Ничего в жизни не стоит бояться — только понимать.",qc:"Мария Кюри",
tg:["радиоактивность","ядерная физика","элементы"],rel:[10,18,29],
prev:"Рентген (1895) открыл X-лучи. Беккерель (1896) — урановые лучи. Но никто не понял: это свойство атомов. Кюри доказали: радиоактивность — внутреннее свойство элементов.",
modern:"Ядерная энергетика (400+ реакторов), лучевая терапия рака, радиоизотопная диагностика (ПЭТ), ядерное оружие (1945), радиоуглеродное датирование (1946) — всё от Кюри. Радиоактивность — основа ядерной физики."},

{e:"XX век",y:"1900-1925",t:"Квантовая механика",s:"Планк, Бор, Гейзенберг, Шрёдингер",c:5,
fullDesc:"Планк ввёл кванты энергии (1900) для объяснения излучения. Эйнштейн объяснил фотоэффект (1905). Бор создал квантовую модель атома (1913). Гейзенберг — матричную механику (1925), Шрёдингер — волновое уравнение (1926). Квантовая механика описала мир атомов.",
context:"Классическая физика не могла объяснить: спектр излучения (ультрафиолетовая катастрофа), фотоэффект, стабильность атомов. Планк предложил: энергия излучается порциями (квантами). Эйнштейн: свет — тоже кванты (фотоны). Бор: электроны на орбитах с дискретной энергией.",
impact:"Квантовая механика — фундамент современной физики. Без неё нет лазеров, транзисторов, полупроводников, компьютеров, ядерной энергетики, МРТ, сверхпроводников. Она описывает 99% явлений Вселенной (кроме гравитации). Это самая успешная теория в истории науки.",
facts:["Планк не верил в реальность квантов — считал математическим трюком","Эйнштейн: «Бог не играет в кости» — спор с Бором","Принцип неопределённости Гейзенберга: нельзя одновременно знать позицию и импульс","Кот Шрёдингера — мысленный эксперимент (жив + мёртв)","Квантовая запутанность — «жуткое действие на расстоянии» (Эйнштейн)"],
timeline:[{year:"1900",text:"Планк вводит кванты энергии"},{year:"1913",text:"Бор — квантовая модель атома"},{year:"1925",text:"Гейзенберг — матричная механика"},{year:"1926",text:"Шрёдингер — волновое уравнение"}],
f:"Физика",im:"Современная физика, технологии",o:"Германия/Дания/Австрия",
q:"Если квантовая механика вас не шокирует — вы её не поняли.",qc:"Нильс Бор",
tg:["кванты","атомы","физика"],rel:[10,19,23],
prev:"Максвелл (1865) — электромагнетизм. Эйнштейн (1905) — относительность. Но микромир не описывался. Планк, Эйнштейн, Бор начали революцию.",
modern:"Лазеры, транзисторы, компьютеры, МРТ, сверхпроводники, ядерная энергетика — всё основано на квантовой механике. Квантовые компьютеры (Google, IBM) — новое применение. 7 Нобелевских премий за квантовую физику."},

{e:"XXI век",y:"2012",t:"Глубокое обучение и ИИ",s:"Hinton, Krizhevsky, Sutskever",c:2,
fullDesc:"AlexNet (2012) — глубокая нейронная сеть — выиграла конкурс ImageNet с рекордной точностью. Это доказало: глубокое обучение (многослойные нейросети) решает сложные задачи (распознавание изображений). Начало революции ИИ.",
context:"Нейронные сети существовали с 1950-х, но не работали на больших данных. GPU (видеокарты) позволили обучать миллионы параметров. AlexNet использовал 2 GPU, 60 млн параметров, 1.2 млн изображений. Ошибка: 15.3% vs 26.2% у второго места. Прорыв.",
impact:"Глубокое обучение изменило всё: распознавание речи (Siri, Alexa), перевод (Google Translate), автономные машины (Tesla), медицинскую диагностику, генерацию текста (ChatGPT, 2022). ИИ стал мейнстримом. Это четвёртая промышленная революция.",
facts:["AlexNet — 8 слоёв, 60 млн параметров, обучался 5-6 дней","Hinton, Krizhevsky, Sutskever — Торонто (Канада)","Google купил команду (2013), создал Google Brain","GPT-3 (2020) — 175 млрд параметров","ChatGPT (2022) — 100 млн пользователей за 2 месяца"],
timeline:[{year:"1958",text:"Розенблатт — перцептрон (первая нейросеть)"},{year:"1986",text:"Обратное распространение ошибки (Румельхарт)"},{year:"2012",text:"AlexNet — прорыв глубокого обучения"},{year:"2022",text:"ChatGPT — ИИ входит в массовое использование"}],
f:"Информатика/ИИ",im:"Искусственный интеллект",o:"Канада/США",
q:"ИИ — это новое электричество.",qc:"Эндрю Ын (NVIDIA CEO)",
tg:["ИИ","нейросети","машинное обучение"],rel:[23,24,26],
prev:"Экспертные системы (1980-е) — правила, не обучение. Статистическое машинное обучение (1990-е) — SVM, деревья решений. Нейросети (2000-е) — мало данных, слабые GPU. Глубокое обучение (2012) — большие данные + GPU + алгоритмы.",
modern:"ИИ везде: поиск, соцсети, рекомендации, автомобили, медицина, наука (AlphaFold — структура белков, 2020). ChatGPT, DALL-E, Midjourney — генеративный ИИ. Это трансформация общества."},

{e:"XXI век",y:"2019",t:"Квантовое превосходство",s:"Google Sycamore",c:10,
fullDesc:"Google Sycamore (53 кубита) решил задачу за 200 секунд, которую классический суперкомпьютер решал бы 10 000 лет. Это «квантовое превосходство» — квантовый компьютер превзошёл классический в конкретной задаче. Начало квантовой эры.",
context:"Квантовые компьютеры используют суперпозицию (0 и 1 одновременно) и запутанность (связь между кубитами). Это позволяет решать задачи, недоступные классическим компьютерам: факторизация чисел, моделирование молекул, оптимизация. Google достиг 53 кубитов с ошибкой 0.6%.",
impact:"Квантовые компьютеры обещают революцию: криптография (взлом RSA), открытие лекарств (моделирование белков), оптимизация логистики, ИИ. Но практические применения — через 10-20 лет. Сейчас — демонстрация принципа.",
facts:["Sycamore — 53 кубита, ошибка 0.6%","Задача: проверка случайности квантовой схемы (бессмысленная, но сложная)","Классический суперкомпьютер Summit (125 петафлопс) — 10 000 лет","IBM (53 кубита, 2019) и Google конкурируют","Квантовая криптография (QKD) — защищённая связь"],
timeline:[{year:"1981",text:"Фейнман предлагает квантовый компьютер"},{year:"1994",text:"Шор — алгоритм факторизации"},{year:"2019",text:"Google Sycamore — квантовое превосходство"},{year:"2023",text:"IBM Condor — 1121 кубит"}],
f:"Информатика/Квантовая физика",im:"Квантовые вычисления",o:"США",
q:"Квантовые компьютеры решат задачи, которые классические не решат никогда.",qc:"Джон Мартинис (Google)",
tg:["квантовые","компьютеры","вычисления"],rel:[23,27,29],
prev:"Фейнман (1981) предложил квантовый компьютер. Шор (1994) — алгоритм факторизации. Первые прототипы (1998) — 2 кубита. IBM, Google, Intel развивали технологию 2010-е.",
modern:"Квантовые компьютеры: IBM (1121 кубит, 2023), Google, IonQ, Rigetti. Применения: криптография, открытие лекарств, оптимизация, ИИ. Квантовый интернет — защищённая связь. Но ошибки (декогеренция) — проблема."}
];

const EO=["Античность","Средневековье","Возрождение","Просвещение","XIX век","XX век","XXI век"];

function route(){
  const hash=window.location.hash||"#/";
  if(hash==="#/"||hash==="#"||hash==="") renderHome();
  else if(hash.startsWith("#/discovery/")){
    const id=parseInt(hash.replace("#/discovery/",""));
    renderDiscovery(id);
  } else renderHome();
}

function renderHome(){
  document.title="Великие открытия человечества";
  const app=document.getElementById("app");
  const eras={};
  D.forEach((d,i)=>{if(!eras[d.e])eras[d.e]=[];eras[d.e].push({...d,idx:i})});
  let shelvesHtml="";
  EO.forEach(era=>{
    const items=eras[era];
    if(!items)return;
    shelvesHtml+=`<div class="shelf"><div class="slabel"><span class="yr">${items[0].y}</span><span class="ln"></span><span class="nm">${era}</span><span class="ln"></span><span class="yr">${items.length} \u0442\u043E\u043C\u0430</span></div><div class="brow">${items.map((d,i)=>{const h=170+((d.idx*37+i*13)%60);return `<a class="bk" href="#/discovery/${d.idx}"><div class="spine c${d.c}" style="min-height:${h}px;width:${62+((d.idx*7+i*11)%20)}px"><div class="gold-line top"></div><div class="btitle">${d.t}</div><div class="bauthor">${d.s.split(' ')[0]}</div><div class="gold-line bot"></div></div></a>`}).join("")}</div><div class="board"></div></div>`;
  });
  app.innerHTML=`<header><h1 onclick="window.location.hash='#/'">Великие открытия<br>человечества</h1><p class="sub">Каждое открытие \u2014 книга на полке истории. Нажмите на корешок, чтобы перейти на страницу открытия</p></header><div class="shelves">${shelvesHtml}</div><div class="stats"><div class="stat"><div class="n">${D.length}</div><div class="l">Открытий</div></div><div class="stat"><div class="n">2 500+</div><div class="l">Лет прогресса</div></div><div class="stat"><div class="n">${EO.length}</div><div class="l">Эпох</div></div><div class="stat"><div class="n">\u221E</div><div class="l">Влияние</div></div></div><footer>Интерактивная карта научных открытий</footer>`;
  window.scrollTo(0,0);
}

function renderDiscovery(idx){
  const d=D[idx];
  if(!d){renderHome();return}
  document.title=d.t+" \u2014 "+d.s;
  const app=document.getElementById("app");
  const factsHtml=(d.facts||[]).map((f,i)=>`<div class="fact-card"><h4>\u0424\u0430\u043A\u0442 \u2116${i+1}</h4><p>${f}</p></div>`).join("");
  const timelineHtml=(d.timeline||[]).map(t=>`<div class="tl-item"><div class="tl-year">${t.year}</div><div class="tl-text">${t.text}</div></div>`).join("");
  const quoteHtml=d.q?`<div class="dp-quote"><p>\u00AB${d.q}\u00BB</p><cite>\u2014 ${d.qc}</cite></div>`:"";
  const relatedHtml=(d.rel||[]).map(ri=>{const r=D[ri];if(!r)return"";return`<a class="related-card" href="#/discovery/${ri}"><div class="rc-title">${r.t}</div><div class="rc-sci">${r.s}</div><div class="rc-year">${r.y}</div></a>`}).join("");

  const prevHtml=d.prev?`<div class="dp-section"><h2>\uD83D\uDD0D Предыдущие попытки</h2><p>${d.prev}</p></div>`:"";
  const critHtml=d.crit?`<div class="dp-section"><h2>\u2694\uFE0F Критика и споры</h2><p>${d.crit}</p></div>`:"";
  const modernHtml=d.modern?`<div class="dp-section"><h2>\uD83D\uDE80 Современное применение</h2><p>${d.modern}</p></div>`:"";
  const personalHtml=d.personal?`<div class="dp-section"><h2>\uD83D\uDC64 Личная история</h2><p>${d.personal}</p></div>`:"";

  app.innerHTML=`<div class="discovery-page"><button class="dp-back" onclick="window.location.hash='#/'">\u2190 К полке открытий</button><div style="margin-bottom:32px"><div class="dp-era">${d.e} \u00B7 ${d.y}</div><h1 class="dp-title">${d.t}</h1><div class="dp-scientist">${d.s}</div><div class="dp-year">${d.y}</div><div class="dp-tags">${(d.tg||[]).map(t=>`<span class="dp-tag">${t}</span>`).join("")}</div></div>${quoteHtml}<div class="dp-section"><h2>\uD83D\uDCD6 Полное описание</h2><p>${d.fullDesc}</p></div>${prevHtml}<div class="dp-section"><h2>\uD83C\uDFDB\uFE0F Контекст и предыстория</h2><p>${d.context}</p></div><div class="dp-section"><h2>\uD83C\uDF0D Влияние на мир</h2><p>${d.impact}</p></div>${modernHtml}<div class="dp-meta"><div class="meta-card"><div class="ml">Область</div><div class="mv">${d.f}</div></div><div class="meta-card"><div class="ml">Влияние</div><div class="mv">${d.im}</div></div><div class="meta-card"><div class="ml">Происхождение</div><div class="mv">${d.o}</div></div><div class="meta-card"><div class="ml">Год</div><div class="mv">${d.y}</div></div></div><div class="dp-section"><h2>\uD83D\uDCA1 Интересные факты</h2><div class="dp-facts">${factsHtml}</div></div><div class="dp-section"><h2>\u23F3 Хронология</h2><div class="dp-timeline">${timelineHtml}</div></div><div class="dp-section"><h2>\uD83D\uDD17 Связанные открытия</h2><div class="dp-related">${relatedHtml}</div></div></div><footer>Интерактивная карта научных открытий \u00B7 ${D.length} объектов</footer>`;
  window.scrollTo(0,0);
}

window.addEventListener("hashchange",route);
window.addEventListener("DOMContentLoaded",route);


// Золотые парящие частицы
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let particles=[];
const PARTICLE_COUNT=60;

function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

class Particle{
  constructor(){this.reset(true)}
  reset(initial){
    this.x=Math.random()*canvas.width;
    this.y=initial?Math.random()*canvas.height:canvas.height+10;
    this.size=Math.random()*2.5+0.5;
    this.speedY=-(Math.random()*0.5+0.2);
    this.speedX=(Math.random()-0.5)*0.3;
    this.opacity=Math.random()*0.5+0.3;
    this.oscillation=Math.random()*Math.PI*2;
    this.oscillationSpeed=Math.random()*0.02+0.005;
    this.oscillationAmplitude=Math.random()*0.8+0.2;
    this.twinkle=Math.random()*Math.PI*2;
    this.twinkleSpeed=Math.random()*0.03+0.01;
  }
  update(){
    this.y+=this.speedY;
    this.oscillation+=this.oscillationSpeed;
    this.x+=Math.sin(this.oscillation)*this.oscillationAmplitude;
    this.twinkle+=this.twinkleSpeed;
    if(this.y<-10)this.reset(false);
  }
  draw(){
    const alpha=this.opacity*(0.7+Math.sin(this.twinkle)*0.3);
    ctx.beginPath();
    const gradient=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size*2);
    gradient.addColorStop(0,`rgba(255,215,100,${alpha})`);
    gradient.addColorStop(0.4,`rgba(212,168,71,${alpha*0.6})`);
    gradient.addColorStop(1,`rgba(180,140,50,0)`);
    ctx.fillStyle=gradient;
    ctx.arc(this.x,this.y,this.size*2,0,Math.PI*2);
    ctx.fill();
  }
}

for(let i=0;i<PARTICLE_COUNT;i++)particles.push(new Particle());

function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{p.update();p.draw()});
  requestAnimationFrame(animateParticles);
}
animateParticles();
</script>
