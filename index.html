*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
:root{--accent:#e63946;--accent-hover:#ff4d6d}
body{font-family:'Crazy',sans-serif;background:#111;color:#f5f5f5;overflow-x:hidden;line-height:1.5}

.layout{display:flex;min-height:100vh}

.sidebar{width:280px;position:fixed;top:0;left:0;height:100vh;background:#0a0a0a;border-right:1px solid #222;padding:40px 30px;display:flex;flex-direction:column;z-index:100}
.sidebar .logo{font-size:1.6rem;font-weight:900;color:#fff;margin-bottom:24px;letter-spacing:-1px}
.sidebar .about-text{font-size:.78rem;color:#888;line-height:1.7;margin-bottom:32px}
.sidebar .about-text span{color:var(--accent);font-weight:700}
.v-label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.65rem;color:#777;letter-spacing:3px;text-transform:uppercase;margin:auto 0}
.social{display:flex;flex-direction:column;gap:14px;margin-top:auto}
.social a{color:#888;text-decoration:none;font-size:.85rem;transition:color .2s}
.social a:hover{color:var(--accent)}

.main{flex:1;margin-left:280px;margin-right:240px}

.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;position:relative;overflow:hidden;background:#0a0a0a}
.hero-card{position:relative;width:100%;max-width:1200px;aspect-ratio:16/9;background:linear-gradient(135deg,#e8f4f8 0%,#d4e9f7 30%,#f0e6ff 70%,#e8f4f8 100%);border-radius:60px;box-shadow:0 30px 80px rgba(0,0,0,0.5);overflow:hidden}
.hero-content{position:absolute;top:10%;left:8%;z-index:10;max-width:50%}
.hero-meta{font-size:1.1rem;color:#333;margin-bottom:20px;letter-spacing:1px}
.hero-year{font-size:1.5rem;font-weight:700;color:#1a1a1a;margin-bottom:24px}
.hero-title{font-size:clamp(3rem,6vw,5.5rem);font-weight:900;color:#1a1a1a;line-height:1;margin-bottom:16px;position:relative;display:inline-block}
.hero-subtitle{font-size:1.8rem;color:#555;letter-spacing:20px;text-transform:uppercase;font-weight:300;margin-top:32px}
.hero-character{position:absolute;right:2%;bottom:2%;width:62%;z-index:5}
.hero-character svg{width:100%;height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,0.3))}
.floating-element{position:absolute;z-index:8;animation:float 6s ease-in-out infinite}
.floating-element.icons{animation-delay:-3s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(5deg)}}
.planet{top:15%;right:25%;width:80px}

.icons{top:30%;right:15%;width:60px}
.slash-marks{position:absolute;z-index:15;color:var(--accent)}
.slash-tl{top:60px;right:80px}
.slash-bl{bottom:60px;left:80px}
.slash-marks svg{width:120px;height:20px}
.cta-btn{padding:18px 48px;background:var(--accent);color:#fff;font-weight:700;font-size:1rem;text-decoration:none;display:inline-block;border:none;cursor:pointer;font-family:inherit;letter-spacing:1px;text-transform:uppercase;transition:background .2s}
.cta-btn:hover{background:var(--accent-hover)}

.nav-bar{display:flex;border-top:1px solid #222;border-bottom:1px solid #222;padding:0 60px}
.nav-bar a{padding:20px 28px;font-size:.8rem;font-weight:700;color:#999;text-decoration:none;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;transition:color .2s;border-bottom:2px solid transparent}
.nav-bar a.active,.nav-bar a:hover{color:#fff;border-bottom-color:var(--accent)}

.section{padding:100px 60px;min-height:60vh}
.section-num{font-size:.75rem;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
.section h2{font-size:clamp(2rem,4vw,3.2rem);font-weight:900;margin-bottom:40px;letter-spacing:-1px}

.svc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#222}
.svc-item{background:#111;padding:48px;transition:background .3s}
.svc-item:hover{background:#1a1a1a}
.svc-num{font-size:.7rem;color:var(--accent);margin-bottom:16px}
.svc-item h3{font-size:1.3rem;font-weight:900;margin-bottom:14px}
.svc-item p{font-size:.95rem;color:#888;line-height:1.6}

.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.proj-card{position:relative;display:block;background:#1a1a1a;overflow:hidden;cursor:pointer;color:inherit;text-decoration:none}
.proj-card img{width:100%;height:240px;object-fit:cover;display:block;transition:transform .4s}
.proj-card:hover img{transform:scale(1.05)}
.proj-card .info{padding:24px}
.proj-card h3{font-size:1.1rem;font-weight:900;margin-bottom:8px}
.proj-card p{font-size:.8rem;color:#888;line-height:1.5;margin-bottom:12px}
.proj-card .tags{display:flex;gap:6px;flex-wrap:wrap}
.proj-card .tags span{font-size:.65rem;padding:4px 10px;background:#222;color:#aaa;border-radius:2px}
.proj-card .arrow{position:absolute;top:20px;right:20px;width:36px;height:36px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:1.1rem;opacity:0;transition:opacity .3s}
.proj-card:hover .arrow{opacity:1}

.right-panel{width:240px;position:fixed;top:0;right:0;height:100vh;background:#0a0a0a;border-left:1px solid #222;padding:40px 24px;display:flex;flex-direction:column}
.rp-item{padding:20px 0;border-bottom:1px solid #222}
.rp-item:last-child{border-bottom:none}
.rp-item .rp-num{font-size:.65rem;color:var(--accent);margin-bottom:6px}
.rp-item h4{font-size:.9rem;font-weight:700;margin-bottom:6px}
.rp-item p{font-size:.75rem;color:#777;line-height:1.5}

.stats{display:flex;border-top:1px solid #222;border-bottom:1px solid #222}
.stat{flex:1;padding:36px;text-align:center;border-right:1px solid #222}
.stat:last-child{border-right:none}
.stat .num{font-size:2.8rem;font-weight:900;color:var(--accent)}
.stat .lbl{font-size:.7rem;color:#888;text-transform:uppercase;letter-spacing:1px;margin-top:6px}

.contact-sec{padding:100px 60px;background:#0a0a0a}
.contact-sec h2{font-size:clamp(2.5rem,5vw,4rem);font-weight:900;margin-bottom:24px}
.contact-sec p{font-size:1.1rem;color:#999;max-width:500px;margin-bottom:40px;line-height:1.6}

footer{padding:40px 60px;border-top:1px solid #222;display:flex;justify-content:space-between;align-items:center}
footer .copy{font-size:.75rem;color:#777}
footer .back-top{font-size:.75rem;color:#888;text-decoration:none;cursor:pointer}
footer .back-top:hover{color:var(--accent)}

@media(max-width:1200px){
  .right-panel{display:none}
  .main{margin-right:0}
}
@media(max-width:900px){
  .sidebar{display:none}
  .main{margin-left:0}
  .mobile-bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;background:#0a0a0a;border-bottom:1px solid #222;padding:14px 24px}
  .mobile-bar .mb-logo{font-weight:900;color:#fff;letter-spacing:-1px}
  .mobile-bar .mb-tg{background:var(--accent);color:#fff;text-decoration:none;font-size:.7rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:10px 16px;transition:background .2s}
  .mobile-bar .mb-tg:hover{background:var(--accent-hover)}
  .hero{padding:40px 24px 0}
  .nav-bar{padding:0 24px;overflow-x:auto}
  .section{padding:60px 24px}
  .svc-grid{grid-template-columns:1fr}
  .proj-grid{grid-template-columns:1fr 1fr}
  .contact-sec{padding:60px 24px}
  footer{padding:30px 24px;flex-direction:column;gap:12px;text-align:center}
}
@media(max-width:600px){
  .proj-grid{grid-template-columns:1fr}
  .stats{flex-direction:column}
  .stat{border-right:none;border-bottom:1px solid #222}
  .hero-card{border-radius:28px}
  .hero-subtitle{letter-spacing:6px;font-size:1.1rem}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mobile-bar{display:none}
.contact-handle{margin-top:20px;font-size:.85rem;color:#777;letter-spacing:1px}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .floating-element{animation:none}
  .proj-card img{transition:none}
}

</style>
</head>

        <div class="floating-element icons">

        </div>
        <div class="hero-character">
          <img id="heroImg" alt="3D персонаж" style="width:100%;height:auto;display:block">
        </div>
      </div>
    </section>

    <nav class="nav-bar" id="navBar"></nav>

    <section class="section" id="services">
      <div class="section-num" id="svcNum"></div>
      <h2 id="svcTitle"></h2>
      <div class="svc-grid" id="svcGrid"></div>
    </section>

    <div class="stats" id="stats"></div>

    <section class="section" id="projects">
      <div class="section-num" id="projNum"></div>
      <h2 id="projTitle"></h2>
      <div class="proj-grid" id="projGrid"></div>
    </section>

    <section class="contact-sec" id="contact">
      <div class="section-num" id="contactNum"></div>
      <h2 id="contactTitle"></h2>
      <p id="contactText"></p>
      <a href="#" target="_blank" rel="noopener" class="cta-btn" id="contactBtn"></a>
      <div class="contact-handle" id="contactHandle"></div>
    </section>

    <footer>
      <div class="copy" id="copy"></div>
      <a class="back-top" id="backTop" href="#top"></a>
    </footer>
  </div>

  <aside class="right-panel" id="rightPanel"></aside>
</div>

    ]

  "panel": [
    {
      "num": "01",
      "title": "Прототипирование",
      "text": "От скетча до кликабельного продукта за один день."
    },
    {
      "num": "02",
      "title": "Веб-разработка",
      "text": "Чистый код без фреймворков. Максимальная скорость."
    },
    {
      "num": "03",
      "title": "3D и анимации",
      "text": "WebGL, Canvas, CSS. Интерактивная графика в браузере."
    },
    {
      "num": "04",
      "title": "AI-интеграция",
      "text": "Использую AI для ускорения разработки в 5-10 раз."
    }
  ],
  "contact": {
    "num": "04 — Контакт",
    "title": "Заказать<br>проект",
    "text": "Есть идея? Расскажите — сделаю прототип или полноценный продукт. Отвечаю в течение нескольких часов.",
    "btn": "Написать в Telegram →"
  },
  "footer": {
    "copy": "© 2026 Вайбкодер. Все проекты рабочие.",
    "top": "Вернуться наверх ↑"
  }
}
</script>

<script>
(function(){
  'use strict';
  var SITE;
  try{ SITE = JSON.parse(document.getElementById('site-data').textContent); }
  catch(e){ console.error('Ошибка данных сайта:', e); return; }

  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  /* Акцентный цвет */
  var accent=(SITE.accent||'#e63946').trim();
  function toWhite(hex,k){
    var m=hex.replace('#','');
    if(!/^([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(m)) return hex;
    if(m.length===3) m=m.charAt(0)+m.charAt(0)+m.charAt(1)+m.charAt(1)+m.charAt(2)+m.charAt(2);
    var r=parseInt(m.substr(0,2),16),g=parseInt(m.substr(2,2),16),b=parseInt(m.substr(4,2),16);
    r=Math.round(r+(255-r)*k); g=Math.round(g+(255-g)*k); b=Math.round(b+(255-b)*k);
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  document.documentElement.style.setProperty('--accent',accent);
  document.documentElement.style.setProperty('--accent-hover',toWhite(accent,0.22));

  var fav=document.querySelector('link[rel="icon"]');
  if(fav){
    var letter=esc(((SITE.general.logo||'В').trim().charAt(0))||'В');
    var fsvg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0a0a0a"/><text x="32" y="45" font-size="38" text-anchor="middle" fill="'+accent+'" font-family="Arial" font-weight="900">'+letter+'</text></svg>';
    fav.setAttribute('href','data:image/svg+xml,'+encodeURIComponent(fsvg));
  }

  /* Общее */
  if(SITE.general.title) document.title=SITE.general.title;
  var md=document.querySelector('meta[name="description"]');
  if(md&&SITE.general.description) md.setAttribute('content',SITE.general.description);
  el('logo').textContent=SITE.general.logo||'';
  el('mbLogo').textContent=SITE.general.logo||'';
  el('about').innerHTML=SITE.general.aboutHtml||'';
  el('vlabel').textContent=SITE.general.vlabel||'';
  var tg=SITE.general.telegram||'';
  var social=el('social'); social.innerHTML='';
  if(tg){
    var sa=document.createElement('a');
    sa.href=tg; sa.target='_blank'; sa.rel='noopener'; sa.textContent='Telegram ↗';
    social.appendChild(sa);
  }
  var mbt=el('mbTg');
  if(tg){ mbt.href=tg; mbt.style.display=''; } else { mbt.style.display='none'; }

  /* Hero */
  el('heroMeta').textContent=SITE.hero.meta||'';
  el('heroYear').textContent=SITE.hero.year||'';
  el('heroTitle').innerHTML=SITE.hero.titleHtml||'';
  el('heroSubtitle').textContent=SITE.hero.subtitle||'';
  var hi=el('heroImg');
  if(SITE.hero.characterImg){ hi.src=SITE.hero.characterImg; hi.parentNode.style.display=''; }
  else{ hi.parentNode.style.display='none'; }

  /* Навигация */
  var nb=el('navBar'); nb.innerHTML='';
  (SITE.nav||[]).forEach(function(n){
    var a=document.createElement('a');
    a.href=n.href||'#'; a.textContent=n.label||'';
    if(n.active) a.className='active';
    nb.appendChild(a);
  });

  /* Услуги */
  el('svcNum').textContent=SITE.services.num||'';
  el('svcTitle').textContent=SITE.services.title||'';
  var sg=el('svcGrid'); sg.innerHTML='';
  (SITE.services.items||[]).forEach(function(s){
    var d=document.createElement('div'); d.className='svc-item';
    d.innerHTML='<div class="svc-num">'+esc(s.num)+'</div><h3>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p>';
    sg.appendChild(d);
  });

  /* Статы */
  var st=el('stats'); st.innerHTML='';
  (SITE.stats||[]).forEach(function(s){
    var d=document.createElement('div'); d.className='stat';
    var num=document.createElement('div'); num.className='num';
    if(/^\d+$/.test(String(s.value))){ num.setAttribute('data-count',String(s.value)); num.textContent='0'; }
    else{ num.textContent=s.value; }
    var lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent=s.label||'';
    d.appendChild(num); d.appendChild(lbl); st.appendChild(d);
  });

  /* Проекты */
  el('projNum').textContent=SITE.projects.num||'';
  el('projTitle').textContent=SITE.projects.title||'';
  var grid=el('projGrid'); grid.innerHTML='';
  (SITE.projects.items||[]).forEach(function(pr){
    var card=document.createElement('a'); card.className='proj-card';
    card.href=pr.url||'#'; card.target='_blank'; card.rel='noopener';
    var tags=(pr.tags||[]).map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('');
    card.innerHTML='<div class="arrow">→</div>'+(pr.img?'<img src="'+esc(pr.img)+'" alt="'+esc(pr.name)+'">':'')+
      '<div class="info"><h3>'+esc(pr.name)+'</h3><p>'+esc(pr.desc)+'</p><div class="tags">'+tags+'</div></div>';
    grid.appendChild(card);
  });

  /* Правая панель */
  var rp=el('rightPanel'); rp.innerHTML='';
  (SITE.panel||[]).forEach(function(x){
    var d=document.createElement('div'); d.className='rp-item';
    d.innerHTML='<div class="rp-num">'+esc(x.num)+'</div><h4>'+esc(x.title)+'</h4><p>'+esc(x.text)+'</p>';
    rp.appendChild(d);
  });

  /* Контакты */
  el('contactNum').textContent=SITE.contact.num||'';
  el('contactTitle').innerHTML=SITE.contact.title||'';
  el('contactText').textContent=SITE.contact.text||'';
  var cb=el('contactBtn');
  cb.textContent=SITE.contact.btn||'Написать';
  if(tg){ cb.href=tg; cb.style.display=''; } else { cb.style.display='none'; }
  el('contactHandle').textContent=SITE.general.handle||'';

  /* Футер */
  el('copy').textContent=SITE.footer.copy||'';
  var bt=el('backTop'); bt.textContent=SITE.footer.top||'Наверх ↑'; bt.href='#top';

  /* Счётчики */
  var counters=document.querySelectorAll('[data-count]');
  var obs=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        var e2=entry.target, target=+e2.dataset.count, count=0, step=target/30;
        var t=setInterval(function(){
          count+=step;
          if(count>=target){ e2.textContent=target; clearInterval(t); }
          else{ e2.textContent=Math.floor(count); }
        },40);
        obs.unobserve(e2);
      }
    });
  },{threshold:0.5});
  counters.forEach(function(c){ obs.observe(c); });

  /* Подсветка разделов в навигации */
  var sections=document.querySelectorAll('.section, .hero, .contact-sec');
  var navLinks=document.querySelectorAll('.nav-bar a');
  window.addEventListener('scroll',function(){
    var cur='';
    sections.forEach(function(s){ if(window.scrollY>=s.offsetTop-200) cur=s.id||'top'; });
    navLinks.forEach(function(a){
      a.classList.remove('active');
      if(a.getAttribute('href')==='#'+cur) a.classList.add('active');
    });
  });
})();
</script>

</body>
</html>
